# compliance-claw — local linux/amd64 deployment.
#
#   docker login ghcr.io                      # the package is not public
#   scripts/bootstrap.sh                      # .env, clone targets, PULL the image
#   scripts/onboard-targets.sh                # register targets with Pretorin
#   docker compose up -d                      # gateway on http://127.0.0.1:18789
#   docker compose run --rm cli pretorin version
#
# THIS FILE PULLS, IT NEVER BUILDS. There is deliberately no `build:` section:
# with one present, `docker compose up` builds whenever the image is missing
# locally, which would let a local build quietly stand in for the released,
# scanned and signed image. Development builds are opt-in through an overlay:
#
#   export COMPOSE_FILE=compose.yaml:compose.build.yaml
#   scripts/bootstrap.sh --build
#
# COMPOSE_FILE is docker compose's own mechanism, so every script in this repo
# inherits the choice without a flag of its own.
#
# Onboard BEFORE `up`. Onboarding writes host-local Pretorin state, and a running
# gateway keeps a per-session `pretorin mcp-serve` child alive that can serve the
# older view (the preflight artifact carries a 3600s TTL). If you must onboard
# while the gateway is up, follow it with:
#   docker compose run --rm cli openclaw mcp reload   # or restart the gateway
#
# The gateway generates ~/.openclaw/openclaw.json into the state volume on first
# start and never overwrites it. `.env` must supply OPENCLAW_GATEWAY_TOKEN or the
# gateway exits 1; PRETORIN_API_KEY may be empty, which only costs platform
# access. See .env.example, docs/plans/phase3.md and docs/plans/phase4.md.
#
# `docker compose down -v` deletes BOTH named volumes: the OpenClaw state volume
# (config, sessions, agent workspace, custom AGENTS.md) AND the Pretorin state
# volume (active context, preflight resolvers, active recipe set). It does NOT
# touch the bind-mounted target repositories under workspace/targets. Recovery is
# re-running bootstrap.sh and onboard-targets.sh; both are idempotent.

name: compliance-claw

# Both services are the same image with the same mounts; only the gateway
# publishes a port. The anchor is what keeps them from drifting apart — a `cli`
# whose mounts differ from the gateway's would debug a different container than
# the one that runs.
x-compliance-claw: &compliance-claw
  # Upstream publishes no linux/arm64 Pretorin binary, so amd64 is the
  # deployment target even on Apple Silicon (emulated). This belongs to the
  # service rather than under `build:` — the Compose schema rejects
  # `build.platform`, and the service key covers both a build and the run.
  platform: linux/amd64
  # The published image. IMAGE_REPO and IMAGE_VERSION are authoritative in
  # versions.env; this literal restates them because compose cannot source a
  # file, and scripts/smoke.sh asserts the two agree. Same documented-duplication
  # shape as the digest pins on the Dockerfile's FROM lines.
  #
  # PIN THE DIGEST once a release is published:
  #   image: ghcr.io/pretorin-ai/compliance-claw:0.1.0@sha256:<digest>
  # A tag is mutable, and the digest an operator verified with `cosign verify` is
  # not necessarily the digest they later pull. The release workflow prints the
  # digest in its job summary for exactly this step; see README.md ('Releasing').
  image: ghcr.io/pretorin-ai/compliance-claw:0.1.0
  env_file:
    # Gitignored and dockerignored, so nothing here is ever baked into a layer.
    # required:false because a fresh clone has no .env — Phase 4's bootstrap
    # writes it, and `cli` commands still work without one.
    - path: .env
      required: false
  volumes:
    # Named volume, not a bind: auth, gateway and MCP state live here and must
    # survive `docker compose down`. `down -v` is what deletes it.
    - openclaw-state:/home/node/.openclaw
    # Pretorin's own state — active context, preflight source resolvers, active
    # recipe set — which lives OUTSIDE ~/.openclaw. It needs its own volume, and
    # it must be mounted on BOTH services: scripts/onboard-targets.sh writes it
    # from a one-off `run --rm cli` container, and the gateway's per-session
    # `pretorin mcp-serve` children are what read it back. Without this, every
    # onboarding run would evaporate with the container that performed it.
    - pretorin-state:/home/node/.pretorin
    # The PARENT of every review target, mounted read-only — the agent reviews
    # code, it never edits it. No repo is named here or in the image: targets.yaml
    # declares them and scripts/bootstrap.sh clones them into this directory.
    - ./workspace/targets:/workspace/targets:ro

services:
  openclaw:
    <<: *compliance-claw
    ports:
      # Never "18789:18789" — a bare port publishes on 0.0.0.0 and exposes the
      # gateway to the whole LAN. The 127.0.0.1 prefix is the security control.
      - "127.0.0.1:18789:18789"

  cli:
    <<: *compliance-claw
    # Run-only: the profile keeps `up` from starting a second gateway.
    profiles: ["cli"]

volumes:
  openclaw-state:
  pretorin-state:
