# File-backed runtime secrets overlay.
#
# Local development:
#   scripts/init-file-secrets.sh --from-env
#   export COMPOSE_FILE=compose.yaml:compose.secrets.yaml:compose.build.yaml
#   docker compose up -d
#
# Published image / VM:
#   export COMPOSE_FILE=compose.yaml:compose.secrets.yaml
#   export COMPLIANCE_CLAW_SECRET_DIR=/run/compliance-claw-secrets
#   docker compose up -d
#
# The base file's env_file is deliberately RESET. Leaving it merged would put
# legacy secret values from .env back into `docker inspect`, defeating this
# overlay even though the mounted files were also present. `.env` is still read
# by the Compose CLI for interpolation of the explicitly listed NON-SECRETS.

x-file-secret-environment: &file-secret-environment
  PRETORIN_KEY_MODE: "${PRETORIN_KEY_MODE:-read-only}"
  SLACK_CHANNEL_ID: "${SLACK_CHANNEL_ID:-}"
  PRETORIN_API_KEY_FILE: /run/secrets/pretorin_api_key
  OPENCLAW_GATEWAY_TOKEN_FILE: /run/secrets/openclaw_gateway_token
  SLACK_APP_TOKEN_FILE: /run/secrets/slack_app_token
  SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
  OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
  ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key

x-file-secrets: &file-secrets
  - pretorin_api_key
  - openclaw_gateway_token
  - slack_app_token
  - slack_bot_token

services:
  openclaw:
    env_file: !reset []
    environment: *file-secret-environment
    secrets:
      - pretorin_api_key
      - openclaw_gateway_token
      - slack_app_token
      - slack_bot_token
      - openai_api_key
      - anthropic_api_key

  cli:
    env_file: !reset []
    environment:
      PRETORIN_KEY_MODE: "${PRETORIN_KEY_MODE:-read-only}"
      SLACK_CHANNEL_ID: "${SLACK_CHANNEL_ID:-}"
      PRETORIN_API_KEY_FILE: /run/secrets/pretorin_api_key
      OPENCLAW_GATEWAY_TOKEN_FILE: /run/secrets/openclaw_gateway_token
      SLACK_APP_TOKEN_FILE: /run/secrets/slack_app_token
      SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
    secrets: *file-secrets

secrets:
  pretorin_api_key:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/pretorin-api-key"
  openclaw_gateway_token:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/openclaw-gateway-token"
  slack_app_token:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/slack-app-token"
  slack_bot_token:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/slack-bot-token"
  openai_api_key:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/openai-api-key"
  anthropic_api_key:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/anthropic-api-key"
