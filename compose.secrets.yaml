# File-backed runtime secrets overlay.
#
# Local development:
#   scripts/init-file-secrets.sh --from-env
#   export COMPOSE_FILE=compose.yaml:compose.secrets.yaml:compose.build.yaml
#   docker compose up -d
#
# Published image / VM:
#   export COMPOSE_FILE=compose.yaml:compose.secrets.yaml
#   export COMPLIANCE_CLAW_SECRET_DIR=/run/compliance-claw-secrets
#   docker compose up -d
#
# The base file's env_file is deliberately RESET. Leaving it merged would put
# legacy secret values from .env back into `docker inspect`, defeating this
# overlay even though the mounted files were also present. `.env` is still read
# by the Compose CLI for interpolation of the explicitly listed NON-SECRETS.

# ONE WORKFLOW, DIFFERENT DELIVERY.
#
# Every credential is supplied the same way — a file under secrets/runtime/,
# written by scripts/init-file-secrets.sh, mounted read-only. What differs per
# service is WHICH ones arrive, and that is least privilege rather than an
# accident. The matrix and its reasoning live in docs/file-secrets.md.
#
#                          openclaw   cli    because
#   pretorin_api_key          yes     yes    both run the CLI / MCP children
#   slack_app_token           yes     yes    gateway runtime; cli seeds Slack config
#   slack_bot_token           yes     yes    same
#   openai_api_key            yes      NO    only the gateway runs agent turns
#   anthropic_api_key         yes      NO    same
#   openclaw_gateway_token    yes      NO    the entrypoint requires it only for
#                                            gateway invocations, and cli is
#                                            one-off by profile
#
# The two NO rows are the interesting ones. Handing `cli` a model key would give a
# one-off container a provider credential it has no use for, and handing it the
# gateway token would let it start a second gateway against the same volumes.

x-secret-environment-shared: &secret-environment-shared
  SLACK_CHANNEL_ID: "${SLACK_CHANNEL_ID:-}"
  PRETORIN_API_KEY_FILE: /run/secrets/pretorin_api_key
  SLACK_APP_TOKEN_FILE: /run/secrets/slack_app_token
  SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token

x-secrets-shared: &secrets-shared
  - pretorin_api_key
  - slack_app_token
  - slack_bot_token

services:
  openclaw:
    env_file: !reset []
    environment:
      <<: *secret-environment-shared
      # Gateway-only: it is the process that binds the port and serves turns.
      OPENCLAW_GATEWAY_TOKEN_FILE: /run/secrets/openclaw_gateway_token
      # Gateway-only: agent turns happen here and nowhere else. Populate exactly
      # ONE of these two files; the entrypoint picks the OpenAI request adapter
      # from whether an OpenAI key is present.
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets:
      - pretorin_api_key
      - slack_app_token
      - slack_bot_token
      - openclaw_gateway_token
      - openai_api_key
      - anthropic_api_key

  cli:
    env_file: !reset []
    # No model key and no gateway token: one-off commands need neither. If a
    # `cli` invocation ever genuinely needs the gateway token, the entrypoint
    # already refuses with a message naming the file to mount rather than failing
    # somewhere deeper.
    environment: *secret-environment-shared
    secrets: *secrets-shared

secrets:
  pretorin_api_key:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/pretorin-api-key"
  openclaw_gateway_token:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/openclaw-gateway-token"
  slack_app_token:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/slack-app-token"
  slack_bot_token:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/slack-bot-token"
  openai_api_key:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/openai-api-key"
  anthropic_api_key:
    file: "${COMPLIANCE_CLAW_SECRET_DIR:-./secrets/runtime}/anthropic-api-key"
