# targets.yaml — the repositories this deployment reviews, and the compliance
# scope they belong to. This file is the POC source of truth: no repository name
# or URL appears in compose.yaml, in the image, or in the agent's instructions.
#
# scripts/bootstrap.sh clones every target into ./workspace/targets/<name>, which
# compose bind-mounts read-only at /workspace/targets. scripts/onboard-targets.sh
# then registers each one with Pretorin as a code_repository source resolver.
#
# BOTH VALUES BELOW ARE DEPLOYMENT-SPECIFIC. They are committed with working
# values so a fresh clone is reproducible end to end; change them for your own
# system. `system_id` may be the UUID or the system name, and the pair matters:
# Pretorin keys preflight state and the active recipe set on system+framework,
# so the same system under two frameworks is two separate compliance efforts.
# List what you have access to with:
#   docker compose run --rm -T cli pretorin --json context list
system_id: 7b74d8f3-d77c-49e4-8792-c372dd154d38
framework_id: soc2

# One or many targets. `name` becomes a directory name and a container path, so
# it is restricted to [A-Za-z0-9._-]. `url` must be an https:// git remote; SSH
# remotes are not supported. `ref` is optional; without it the clone stays on the
# remote's default branch.
#
# `private: true` marks a target that needs authentication to clone. It is a FLAG
# ONLY — no token, no credential, and no path to one appears in this file, which is
# committed. scripts/bootstrap.sh mints a short-lived read-only GitHub App
# installation token on the host, clones with it, and deletes it; the container
# receives the working tree over its read-only mount and never a git credential.
# Private targets must be on github.com, since that is where the App token works.
# Configure the App in .env (GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY_FILE).
targets:
  - name: simple-crm
    url: https://github.com/pretorin-ai/simple-crm.git
    ref: main

  # The private example. Present so a fresh clone exercises the private path end
  # to end; it is a test/example target and nothing else depends on it. Remove it
  # if you have no GitHub App configured — a private target with no App is a hard
  # failure, on purpose, rather than a silent anonymous clone attempt.
  - name: crm-deploy
    url: https://github.com/pretorin-ai/crm-deploy.git
    ref: master
    private: true
