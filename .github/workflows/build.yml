# Build the amd64 image and run the no-credential smoke section.
#
# NO CREDENTIALS EVER LIVE HERE. No Pretorin API key, no model key, no gateway
# token from a secret. Everything CI exercises is reachable without them:
# the supply-chain verification of the Pretorin binary, the generated config,
# the mount posture, the stale-template warning, the targets.yaml parser, and
# the CWD fix — including the proof that no /app source resolver survives
# onboarding, which needs no key because resolver binding is host-local.
#
# The credentialed section of scripts/smoke.sh self-skips when PRETORIN_API_KEY
# does not authenticate, so `--no-creds` is belt-and-braces rather than the only
# thing keeping CI honest.
#
# ubuntu-latest is amd64, so the image builds natively here: no qemu, and the
# emulation probe in bootstrap.sh short-circuits.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # compose.yaml pulls the published image by default, which is wrong for CI:
    # the point here is to test the code in this commit, not whatever was last
    # released. The build overlay adds the build section back. COMPOSE_FILE is
    # docker compose's own mechanism, so bootstrap.sh and smoke.sh all inherit it
    # without a CI-specific flag.
    #
    # compose.efforts.yaml IS REQUIRED, not optional. efforts.yaml is what the
    # deployment reads, and that overlay is what mounts it into the gateway —
    # compose.yaml deliberately does not, because the file is gitignored and a
    # base-file bind mount would fail `up` on a fresh clone before anything could
    # explain why. Without it here the gateway comes up with no declaration of
    # which repositories exist, and /target-sync can address nothing.
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml:compose.efforts.yaml

    steps:
      # Pinned to a commit: a tag is mutable, and this is the step that fetches
      # the code everything else in the job then runs.
      #
      # v5. Keep this in step with .github/workflows/release.yml — they were
      # briefly on v4 and v5 respectively, and the runner flagged the v4 pin as
      # targeting a deprecated Node 20. Two workflows checking out the same repo
      # two different ways is a difference with no reason behind it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Show toolchain
        run: |
          docker version
          docker compose version
          python3 --version
          git --version

      # The committed targets.yaml must be clonable with NO credentials at all.
      # CI holds none by design, and neither does someone doing a fresh clone with
      # nothing but a Pretorin key — so a `private: true` target in the default
      # file breaks both. This is a guard, not a preference: it shipped once and
      # failed here in 21 seconds.
      - name: Assert the committed targets.yaml needs no credentials
        run: |
          set -euo pipefail
          if python3 scripts/parse-targets.py list | cut -f3 | grep -qx true; then
            echo "::error::targets.yaml declares a private target. The committed"
            echo "::error::default must clone anonymously — CI has no GitHub App, and"
            echo "::error::neither does a first-time reader. Comment it out."
            exit 1
          fi
          echo "targets.yaml is credential-free, as required."

      # efforts.yaml IS THE RUNTIME AUTHORITY AND IS GITIGNORED, so CI has none —
      # it names YOUR systems. It is produced here the same way an operator
      # produces one, from the committed targets.yaml, which keeps CI on the
      # documented path instead of a shortcut that could rot unnoticed.
      #
      # The channel id is a throwaway: CI has no Slack app, nothing routes, and
      # `migrate` refuses to invent one precisely because a placeholder that
      # validates and routes nowhere is the failure that looks like a broken bot.
      # Here there is no bot to break, and the id has to satisfy the schema.
      - name: Convert targets.yaml into efforts.yaml (the documented migration)
        run: |
          set -euo pipefail
          scripts/clawctl migrate --name ci-effort --slack-channel-id C0000000CI
          python3 scripts/parse-efforts.py validate efforts.yaml
          # BOTH BIND SOURCES MUST EXIST BEFORE ANY COMPOSE COMMAND. Compose
          # resolves every bind source at `up`/`run` time and a missing one fails
          # the whole command naming neither the file nor the fix.
          # compose.efforts.yaml mounts efforts.yaml (just created) and the
          # per-effort credential DIRECTORY, which is gitignored and so never
          # exists on a fresh checkout. `scripts/clawctl` creates it for an
          # operator; CI never runs apply, so it is created here.
          mkdir -p secrets/runtime/pretorin
          echo "efforts.yaml generated from targets.yaml and valid."

      # Runs the documented operator path rather than a CI-only shortcut, so a
      # break in bootstrap.sh fails here instead of on someone's laptop. It
      # clones the public target declared in efforts.yaml, writes a throwaway
      # .env with a generated gateway token (PRETORIN_API_KEY stays empty), and
      # builds.
      - name: Bootstrap (write .env, clone targets, build image)
        run: bash scripts/bootstrap.sh --build

      - name: Assert no credentials are configured
        run: |
          set -e
          fail=0
          # Phase 5 adds two more secret classes that must never reach CI: Slack
          # tokens and the GitHub App private key. Checked by name rather than by
          # value, because there is no value here to compare against.
          for k in PRETORIN_API_KEY SLACK_BOT_TOKEN SLACK_APP_TOKEN GITHUB_APP_ID GITHUB_READONLY_PAT; do
            if grep -qE "^${k}=.+" .env; then
              echo "::error::CI generated a .env with ${k} set. It must stay empty."
              fail=1
            fi
          done
          if ls secrets/*.pem >/dev/null 2>&1; then
            echo "::error::a private key is present under secrets/. CI must hold none."
            fail=1
          fi
          # The git credential the container can hold. CI must never carry one:
          # every target-sync test builds its own local repositories, and the
          # private path is manual acceptance against real GitHub by design.
          if [ -s secrets/runtime/github-readonly-pat ]; then
            echo "::error::a GitHub PAT is present under secrets/runtime/. CI must hold none."
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "No Pretorin, Slack, model or GitHub App credentials are configured."

      # Ahead of the full suite on purpose: it needs no credentials, no gateway
      # and no network, so when the CLI updater's input rules break, that is the
      # first thing the log says rather than the fortieth.
      - name: CLI updater input rules (offline, no credentials)
        run: bash scripts/pretorin-update.sh --self-test

      # Same reasoning, and same position: no credentials, no gateway, no
      # network. It builds throwaway local repositories and drives the REAL
      # sync functions against them — the ones bootstrap.sh and both Slack
      # routes use — so a break in the fast-forward semantics, the refusal
      # outcomes, the input rules, the global lock or the credential handling
      # fails here in seconds rather than in the full suite.
      - name: Target sync rules and outcomes (offline, no credentials)
        run: bash scripts/sync-targets.sh --self-test

      # Same reasoning and same position as the two gates above: no credentials,
      # no gateway, no network, no containers. The effort schema turns operator
      # text into directory names, container paths, credential file paths and
      # process environment, so its rejection table is the first thing that
      # should speak when it breaks.
      - name: Effort schema, injection rules and the credential ladder (offline)
        run: python3 scripts/parse-efforts.py --self-test

      # Same position and same reasoning again. This one owns the OpenClaw
      # configuration this deployment generates, so its rejection table covers
      # the failures that would be invisible until Slack behaved oddly: a DM
      # admitted with no binding (which routes to the DEFAULT agent), one user
      # bound to two efforts, a binding to an agent that no longer exists, and a
      # patch naming a config path this deployment does not own.
      - name: OpenClaw patch generation and its refusals (offline)
        run: python3 scripts/openclaw-patch.py --self-test

      # The committed example must stay valid and credential-free, for the same
      # two readers the targets.yaml guard above exists for: a fresh clone with
      # nothing but a Pretorin key, and CI, which holds none.
      - name: Assert the committed efforts.example.yaml is valid and credential-free
        run: |
          set -euo pipefail
          python3 scripts/parse-efforts.py validate efforts.example.yaml
          for e in $(python3 scripts/parse-efforts.py efforts efforts.example.yaml); do
            if python3 scripts/parse-efforts.py list "$e" efforts.example.yaml \
                 | cut -f3 | grep -qx true; then
              echo "::error::efforts.example.yaml declares a private target. The"
              echo "::error::committed example must need no credential at all."
              exit 1
            fi
          done
          echo "efforts.example.yaml is valid and credential-free, as required."

      # Drives the REAL clawctl against a stub `docker` that records argv, so
      # this asserts what clawctl WOULD run rather than what it says it would:
      # migrate correctness and idempotence, `plan` starting zero containers and
      # changing zero bytes, the scope pin and named credential on every Pretorin
      # invocation, `context set` on none of them, each echoed line byte-identical
      # to the argv issued, and — new with multi-agent — that every gateway-bound
      # verification goes through `compose exec -T openclaw` rather than the `cli`
      # container, which cannot reach the gateway and would report a dead check as
      # a skip forever.
      - name: clawctl behaviour (offline, stub docker, no credentials)
        run: bash scripts/clawctl --self-test

      - name: Smoke test (no-credential section only)
        run: bash scripts/smoke.sh --no-creds

      # smoke.sh's A4d asserts the file-secret OVERLAY renders correctly, which is
      # a static compose-config check. It cannot prove the other half of the
      # contract — that the entrypoint actually loads a mounted file, that the
      # value stays out of `docker inspect`, and that a dual source is refused.
      # That half is the whole point of the deployment interface, so it gets its
      # own gate. It uses fake canary values only and needs no credentials.
      - name: File-secret contract (runtime behaviour)
        run: bash scripts/test-file-secrets.sh compliance-claw:local

      # THE HALF THE SCHEMA SELF-TEST CANNOT SEE. parse-efforts.py proves the
      # credential LADDER resolves the right path; only a running container can
      # prove the value actually reaches the MCP child, that it stays out of
      # `docker inspect` and out of argv, and — the one that matters most — that
      # a missing, empty or unresolvable credential FAILS CLOSED instead of
      # falling through to the container-wide default key. A launcher that fell
      # through would run one effort's agent on another effort's credential,
      # writing to the wrong compliance scope with a perfectly valid key.
      # Canary values only; no credentials.
      - name: Per-effort credential containment (runtime behaviour)
        run: bash scripts/test-effort-credentials.sh compliance-claw:local

      # THE INTERACTION NEITHER OF THE GATES ABOVE CAN SEE. test-file-secrets.sh
      # points bootstrap at an unreachable target, so it dies at the clone and
      # never reaches the image phase; smoke's Slack rows invoke the image with
      # `docker run`, bypassing bootstrap, Compose and COMPOSE_FILE entirely.
      # A fresh file-secret deployment coming up Slack-less lived in the gap
      # between them. Its own isolated project, canary tokens, no credentials.
      - name: Fresh deployment configures Slack by itself (isolated project)
        run: bash scripts/test-fresh-slack-seed.sh

      - name: Gateway logs on failure
        if: failure()
        run: docker compose logs --no-color openclaw || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
