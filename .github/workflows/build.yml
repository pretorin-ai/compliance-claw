# Build the amd64 image and run the no-credential smoke section.
#
# NO CREDENTIALS EVER LIVE HERE. No Pretorin API key, no model key, no gateway
# token from a secret. Everything CI exercises is reachable without them:
# the supply-chain verification of the Pretorin binary, the generated config,
# the mount posture, the stale-template warning, the targets.yaml parser, and
# the CWD fix — including the proof that no /app source resolver survives
# onboarding, which needs no key because resolver binding is host-local.
#
# The credentialed section of scripts/smoke.sh self-skips when PRETORIN_API_KEY
# does not authenticate, so `--no-creds` is belt-and-braces rather than the only
# thing keeping CI honest.
#
# ubuntu-latest is amd64, so the image builds natively here: no qemu, and the
# emulation probe in bootstrap.sh short-circuits.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # compose.yaml pulls the published image by default, which is wrong for CI:
    # the point here is to test the code in this commit, not whatever was last
    # released. The overlay adds the build section back. COMPOSE_FILE is docker
    # compose's own mechanism, so bootstrap.sh, onboard-targets.sh and smoke.sh
    # all inherit it without a CI-specific flag.
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml

    steps:
      # Pinned to a commit: a tag is mutable, and this is the step that fetches
      # the code everything else in the job then runs.
      #
      # v5. Keep this in step with .github/workflows/release.yml — they were
      # briefly on v4 and v5 respectively, and the runner flagged the v4 pin as
      # targeting a deprecated Node 20. Two workflows checking out the same repo
      # two different ways is a difference with no reason behind it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Show toolchain
        run: |
          docker version
          docker compose version
          python3 --version
          git --version

      # The committed targets.yaml must be clonable with NO credentials at all.
      # CI holds none by design, and neither does someone doing a fresh clone with
      # nothing but a Pretorin key — so a `private: true` target in the default
      # file breaks both. This is a guard, not a preference: it shipped once and
      # failed here in 21 seconds.
      - name: Assert the committed targets.yaml needs no credentials
        run: |
          set -euo pipefail
          if python3 scripts/parse-targets.py list | cut -f3 | grep -qx true; then
            echo "::error::targets.yaml declares a private target. The committed"
            echo "::error::default must clone anonymously — CI has no GitHub App, and"
            echo "::error::neither does a first-time reader. Comment it out."
            exit 1
          fi
          echo "targets.yaml is credential-free, as required."

      # Runs the documented operator path rather than a CI-only shortcut, so a
      # break in bootstrap.sh fails here instead of on someone's laptop. It
      # clones the public target from targets.yaml, writes a throwaway .env with
      # a generated gateway token (PRETORIN_API_KEY stays empty), and builds.
      - name: Bootstrap (write .env, clone targets, build image)
        run: bash scripts/bootstrap.sh --build

      - name: Assert no credentials are configured
        run: |
          set -e
          fail=0
          # Phase 5 adds two more secret classes that must never reach CI: Slack
          # tokens and the GitHub App private key. Checked by name rather than by
          # value, because there is no value here to compare against.
          for k in PRETORIN_API_KEY SLACK_BOT_TOKEN SLACK_APP_TOKEN GITHUB_APP_ID GITHUB_READONLY_PAT; do
            if grep -qE "^${k}=.+" .env; then
              echo "::error::CI generated a .env with ${k} set. It must stay empty."
              fail=1
            fi
          done
          if ls secrets/*.pem >/dev/null 2>&1; then
            echo "::error::a private key is present under secrets/. CI must hold none."
            fail=1
          fi
          # The git credential the container can hold. CI must never carry one:
          # every target-sync test builds its own local repositories, and the
          # private path is manual acceptance against real GitHub by design.
          if [ -s secrets/runtime/github-readonly-pat ]; then
            echo "::error::a GitHub PAT is present under secrets/runtime/. CI must hold none."
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "No Pretorin, Slack, model or GitHub App credentials are configured."

      # Ahead of the full suite on purpose: it needs no credentials, no gateway
      # and no network, so when the CLI updater's input rules break, that is the
      # first thing the log says rather than the fortieth.
      - name: CLI updater input rules (offline, no credentials)
        run: bash scripts/pretorin-update.sh --self-test

      # Same reasoning, and same position: no credentials, no gateway, no
      # network. It builds throwaway local repositories and drives the REAL
      # sync functions against them — the ones bootstrap.sh and both Slack
      # routes use — so a break in the fast-forward semantics, the refusal
      # outcomes, the input rules, the global lock or the credential handling
      # fails here in seconds rather than in the full suite.
      - name: Target sync rules and outcomes (offline, no credentials)
        run: bash scripts/sync-targets.sh --self-test

      - name: Smoke test (no-credential section only)
        run: bash scripts/smoke.sh --no-creds

      # smoke.sh's A4d asserts the file-secret OVERLAY renders correctly, which is
      # a static compose-config check. It cannot prove the other half of the
      # contract — that the entrypoint actually loads a mounted file, that the
      # value stays out of `docker inspect`, and that a dual source is refused.
      # That half is the whole point of the deployment interface, so it gets its
      # own gate. It uses fake canary values only and needs no credentials.
      - name: File-secret contract (runtime behaviour)
        run: bash scripts/test-file-secrets.sh compliance-claw:local

      - name: Gateway logs on failure
        if: failure()
        run: docker compose logs --no-color openclaw || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true
