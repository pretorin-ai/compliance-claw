# Publish a scanned, SBOM-bearing linux/amd64 image to GHCR, by immutable digest.
#
# Cut a release:
#   gh release create vX.Y.Z --target master --generate-notes
#
# That is the whole trigger. NO VERSION-BUMP PR IS REQUIRED BEFOREHAND. Afterwards,
# ONE post-release PR pins what this run published — IMAGE_VERSION in versions.env
# and the matching version tag plus immutable digest in compose.yaml — because the
# digest cannot be known until the image has been built.
#
# THE RELEASE IS THE SOURCE OF TRUTH FOR THE VERSION. Modelled on
# pretorin-ai/pretorin-cli's release-binaries.yml, which triggers on
# `release: published`, derives the version from the release tag, and validates the
# build against it. The earlier design here inverted that — versions.env held the
# version and the tag had to match it — which forced a version-bump commit BEFORE
# every release and a digest-pin commit AFTER it. Two PRs to ship one image.
# Deriving from the tag removes the first one entirely.
#
# So `IMAGE_VERSION` in versions.env no longer means "the version we are about to
# release". It means "the version this checkout deploys", and it moves together with
# compose.yaml's digest pin in the single post-release commit. scripts/smoke.sh still
# asserts the two agree, which is now a statement about the deployment rather than
# about the release.
#
# PUBLISH ORDER, also from pretorin-cli: push BY DIGEST first, verify the digest
# round-trips, and only THEN apply the human-readable version tag. A floating tag
# must never point at bytes that have not been checked.
#
# THE IMAGE IS NOT SIGNED. Integrity comes from the immutable digest, the
# release-time vulnerability scan, and the SBOM. pretorin-cli signs with an Azure
# Key Vault HSM key over OIDC on a private ARC runner (no Fulcio, no Rekor); this
# repository has no ARC runner and asserts CI holds zero credentials, so signing is
# tracked as planned work in SECURITY.md ledger item 5 rather than half-done here.
#
# NO CREDENTIALS LIVE HERE beyond the automatic GITHUB_TOKEN. The first step asserts
# that rather than trusting this comment.
#
# Pin carve-out: `uses:` cannot read versions.env, so action SHAs are pinned here.
# trivy and syft install from versions.env pins with checksum verification.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, scan and SBOM only — do not push or tag"
        type: boolean
        default: true

# Workflow default, inherited by `publish`. `attach-sbom` overrides it — a job-level
# permissions block REPLACES this one, so that job gets contents:write and no
# packages access at all. No job holds both.
permissions:
  contents: read
  packages: write     # push to GHCR — the only write `publish` performs

# ONE release at a time, repo-wide — deliberately not per-ref. Two runs on
# different tags would otherwise overlap on the shared `:build` staging ref
# below. That race is not corrupting (the digest is read from the local image
# right after push, never by resolving the tag), but a publish pipeline that can
# interleave with itself is a bad thing to have to reason about.
#
# cancel-in-progress stays false: a half-cancelled release is worse than a slow
# one, and a run that has pushed but not yet tagged must be allowed to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.pins.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      # actions/checkout v5, pinned to its commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Assert this workflow uses no credentials beyond GITHUB_TOKEN
        run: |
          set -euo pipefail
          if grep -oE 'secrets\.[A-Z_]+' .github/workflows/release.yml \
             | grep -v 'secrets.GITHUB_TOKEN' ; then
            echo "::error::release.yml references a secret other than GITHUB_TOKEN"
            exit 1
          fi
          echo "No credentials configured beyond the automatic GITHUB_TOKEN."

      # THE VERSION COMES FROM THE RELEASE TAG. On workflow_dispatch there is no
      # tag, so a dry run labels itself from versions.env — enough to rehearse the
      # pipeline without inventing a release.
      - name: Resolve version and pins
        id: pins
        run: |
          set -euo pipefail
          . ./versions.env
          for v in IMAGE_REPO TRIVY_VERSION TRIVY_SHA256 SYFT_VERSION SYFT_SHA256; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "::error::$v is not set in versions.env"; exit 1; }
            echo "$v=$val" >> "$GITHUB_OUTPUT"
          done

          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            case "$TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::release tag '${TAG}' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
            esac
            VERSION="${TAG#v}"
            echo "release ${TAG} -> version ${VERSION}"
            # versions.env is ALLOWED to lag here: it describes what the checkout
            # DEPLOYS, and the pin commit that updates it lands after this run.
            if [ "${VERSION}" != "${IMAGE_VERSION:-}" ]; then
              echo "::notice::versions.env still says IMAGE_VERSION=${IMAGE_VERSION:-unset}; the post-release pin commit moves it to ${VERSION}."
            fi
          else
            VERSION="${IMAGE_VERSION:?IMAGE_VERSION unset and no release tag}"
            echo "dry run, labelling from versions.env -> ${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REPO}:${VERSION}" >> "$GITHUB_OUTPUT"
          # A CONSTANT staging ref, not build-${GITHUB_SHA}.
          #
          # `docker push` needs a tag, so publishing by digest requires some tag
          # to exist first. A per-commit name made that tag accumulate forever,
          # and it CANNOT BE CLEANED UP AFTERWARDS: on GHCR a package version IS
          # a digest and tags are attributes of it, so once the version tag is
          # applied, the staging tag and the release tag are the same version.
          # Deleting "the staging tag" would delete the released image.
          #
          # A constant name means at most one such tag exists, permanently
          # pointing at the most recent successful build. Nothing accumulates,
          # and nothing has to be deleted on the success path.
          echo "build_ref=${IMAGE_REPO}:build" >> "$GITHUB_OUTPUT"

      # trivy and syft from pinned versions, compared against pinned digests. CI
      # installs no unverified binary, for the same reason the build does not.
      - name: Install pinned release tooling
        env:
          TRIVY_VERSION: ${{ steps.pins.outputs.TRIVY_VERSION }}
          TRIVY_SHA256: ${{ steps.pins.outputs.TRIVY_SHA256 }}
          SYFT_VERSION: ${{ steps.pins.outputs.SYFT_VERSION }}
          SYFT_SHA256: ${{ steps.pins.outputs.SYFT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          TRIVY_TGZ="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$TRIVY_TGZ" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${TRIVY_TGZ}"
          echo "${TRIVY_SHA256}  ${TRIVY_TGZ}" | sha256sum -c -
          tar xzf "$TRIVY_TGZ" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

          SYFT_TGZ="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$SYFT_TGZ" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${SYFT_TGZ}"
          echo "${SYFT_SHA256}  ${SYFT_TGZ}" | sha256sum -c -
          tar xzf "$SYFT_TGZ" syft
          sudo install -m 0755 syft /usr/local/bin/syft

          trivy --version | head -1
          syft version | head -2

      # ubuntu-latest is amd64, so this is a native build: no qemu, and the
      # Dockerfile's own gates (Pretorin signature + digest, Slack plugin integrity)
      # run here exactly as they do on an operator's machine.
      # IMAGE_SELF_VERSION is what the image will say it is: the OCI version label
      # and the IMAGE_VERSION line of the versions.env copy inside it. It comes
      # from the release TAG, because versions.env in this checkout still holds
      # the PREVIOUS release's number -- the commit that moves it lands after this
      # run. Baking that stale line is exactly how v0.2.0 shipped saying 0.1.0.
      - name: Build
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg "IMAGE_SELF_VERSION=${VERSION}" \
            -t "$BUILD_REF" .

          # Assert it took, here rather than at the end: a mislabelled image must
          # not reach a scan, a push or an operator.
          LABEL="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$BUILD_REF")"
          [ "$LABEL" = "$VERSION" ] \
            || { echo "::error::image label says '${LABEL}', expected '${VERSION}'"; exit 1; }
          BAKED="$(docker run --rm --entrypoint bash "$BUILD_REF" -lc \
            'awk -F= "/^IMAGE_VERSION=/{print \$2}" /opt/compliance-claw/versions.env')"
          [ "$BAKED" = "$VERSION" ] \
            || { echo "::error::baked versions.env says '${BAKED}', expected '${VERSION}'"; exit 1; }
          echo "image self-reports ${VERSION} (OCI label and baked versions.env)"

      - name: Smoke the built image
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint bash "$BUILD_REF" -lc "$1"; }
          ARCH="$(run 'uname -m')"
          [ "$ARCH" = x86_64 ] || { echo "::error::image arch is ${ARCH}"; exit 1; }
          run 'pretorin version'
          run 'openclaw --version'
          # The Slack plugin has to be present in the image, not merely referenced
          # by the config template — this is the check a broken COPY would fail.
          run 'test -f /opt/compliance-claw/plugins/slack/dist/index.js'
          run 'test -f /opt/compliance-claw/slack-channel.patch.json5'
          echo "image smoke passed (${ARCH})"

      # File-backed secrets are a DEPLOYMENT INTERFACE, so the gate belongs on the
      # bytes operators actually pull, not only on the pull request that changed
      # them. build.yml runs this against the PR's local build; without it here, a
      # release could publish an image whose entrypoint no longer honours a mounted
      # secret and nothing between the merge and the VM would notice. Canary values
      # only — this workflow asserts it holds no credentials, and this keeps that true.
      - name: File-secret contract on the built image
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: bash scripts/test-file-secrets.sh "$BUILD_REF"

      # Exceptions printed BEFORE the gate, not buried in a file nobody opens.
      - name: Show the vulnerability exceptions being applied
        run: |
          set -euo pipefail
          {
            echo "### Vulnerability exceptions in effect"
            echo ""
            echo "From \`.trivyignore.yaml\`. Each is a fixable CRITICAL being shipped anyway."
            echo ""
            python3 - <<'PY'
          import datetime, re
          text = open(".trivyignore.yaml").read()
          entries = re.findall(r"- id:\s*(\S+)(.*?)(?=\n  - id:|\Z)", text, re.S)
          today = datetime.date.today()
          for vid, body in entries:
              exp = re.search(r"expired_at:\s*(\S+)", body)
              exp = exp.group(1) if exp else "NEVER"
              flag = ""
              if exp != "NEVER":
                  d = datetime.date.fromisoformat(exp)
                  left = (d - today).days
                  flag = f" ({left} days left)" if left >= 0 else " (EXPIRED)"
              print(f"- `{vid}` expires {exp}{flag}")
          print()
          print(f"{len(entries)} exception(s).")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL POLICY:
      #   CRITICAL with a fix available -> the release is blocked.
      #   HIGH, and CRITICAL with no fix -> reported, does not block.
      #   listed in .trivyignore.yaml   -> shipped, with a dated reason, until it expires.
      #
      # --ignore-unfixed and --ignorefile both exist because the OpenClaw base image
      # ships five fixable CRITICALs this repository cannot patch without abandoning
      # its digest-pinned base. Every exception is per-id, justified, and EXPIRES, so
      # a new fixable CRITICAL still stops the release.
      - name: Vulnerability scan (blocking — fixable CRITICAL)
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 --format table "$BUILD_REF"

      - name: Vulnerability report (non-blocking — HIGH and unfixed CRITICAL)
        if: always()
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          {
            echo "### Vulnerability report"
            echo '```'
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
              --format table "$BUILD_REF" 2>&1 | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          syft "docker:${BUILD_REF}" -o spdx-json > "sbom-${VERSION}.spdx.json"
          N="$(python3 -c "import json;print(len(json.load(open('sbom-${VERSION}.spdx.json')).get('packages',[])))")"
          echo "SBOM packages: ${N}"
          [ "$N" -gt 0 ] || { echo "::error::the SBOM contains no packages"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ steps.pins.outputs.version }}
          path: sbom-${{ steps.pins.outputs.version }}.spdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # STEP 1 OF 2: publish BY DIGEST under the constant staging ref resolved
      # above (`:build`), never a per-release name. The version tag is deliberately
      # NOT applied yet — see the verify step below. This is pretorin-cli's
      # ordering: bytes are published and checked before any human-readable tag
      # points at them.
      - name: Push by digest
        id: push
        if: ${{ !inputs.dry_run }}
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          docker push "$BUILD_REF"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$BUILD_REF" | cut -d@ -f2)"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::could not read the pushed digest (got '${DIGEST}')"; exit 1 ;;
          esac
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed by digest: ${DIGEST}"

      # Prove the registry returns what we sent, BEFORE the version tag exists. The
      # local image is removed first so the pull cannot be served from cache, and the
      # SBOM is regenerated from the pulled bytes and compared.
      - name: Verify the published digest round-trips
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          docker rmi "$BUILD_REF" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

          docker pull "${IMAGE_REPO}@${DIGEST}"

          ARCH="$(docker run --rm --entrypoint bash "${IMAGE_REPO}@${DIGEST}" -lc 'uname -m')"
          [ "$ARCH" = x86_64 ] || { echo "::error::pulled image arch is ${ARCH}"; exit 1; }
          docker run --rm --entrypoint bash "${IMAGE_REPO}@${DIGEST}" -lc 'pretorin version'

          syft "docker:${IMAGE_REPO}@${DIGEST}" -o spdx-json > sbom.pulled.json
          BUILT="$(python3 -c "import json;print(len(json.load(open('sbom-${VERSION}.spdx.json')).get('packages',[])))")"
          PULLED="$(python3 -c 'import json;print(len(json.load(open("sbom.pulled.json")).get("packages",[])))')"
          echo "SBOM packages: built=${BUILT} pulled=${PULLED}"
          [ "$BUILT" = "$PULLED" ] || { echo "::error::pulled image inventory differs from the built image"; exit 1; }
          echo "digest round-trip verified"

      # STEP 2 OF 2: only now does the version tag point at the digest, and only at a
      # digest that has been pulled back and re-inventoried.
      #
      # A tag is added by re-PUTting THE SAME MANIFEST BYTES under the tag name. A
      # digest IS the hash of those bytes, so this preserves it by construction --
      # there is no operation to get wrong.
      #
      # `docker buildx imagetools create --tag X repo@digest` is NOT that operation
      # and must not be used here. It does not move a tag; it BUILDS A NEW MANIFEST
      # LIST wrapping the source, which by definition hashes differently. v0.2.0's
      # first release attempt proved it: the step published
      # `sha256:351ecb37...` (a manifest.list) for a verified
      # `sha256:34619259...` (a manifest.v2), and the assertion below correctly
      # refused to let a tag point at bytes nothing had verified.
      #
      # `docker tag` + `docker push` would probably preserve the digest for a
      # single manifest, but only as a side effect of the client regenerating an
      # identical manifest. "Probably" is not a supply-chain control.
      - name: Apply the version tag to the verified digest
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
          VERSION: ${{ steps.pins.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_PATH="${IMAGE_REPO#ghcr.io/}"
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'

          # A registry bearer token for this repository only, exchanged from the
          # automatic GITHUB_TOKEN. Same credential `docker login` already used.
          TOKEN="$(curl -fsSL -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO_PATH}:pull,push" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          [ -n "$TOKEN" ] || { echo "::error::could not obtain a ghcr.io token"; exit 1; }

          # Content-Type must be echoed back exactly: it is part of what the digest
          # covers, so guessing it would change the bytes and hence the digest.
          CT="$(curl -fsSL -o manifest.json -w '%{content_type}' \
            -H "Authorization: Bearer ${TOKEN}" -H "Accept: ${ACCEPT}" \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/${DIGEST}")"

          # Gate 1: the bytes we are about to re-PUT really are the verified image.
          LOCAL="sha256:$(sha256sum manifest.json | cut -d' ' -f1)"
          [ "$LOCAL" = "$DIGEST" ] \
            || { echo "::error::fetched manifest hashes to ${LOCAL}, expected ${DIGEST}"; exit 1; }

          # Gate 2: the registry's own accounting of what it just stored.
          STORED="$(curl -fsSL -X PUT -o /dev/null -w '%header{docker-content-digest}' \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: ${CT}" \
            --data-binary @manifest.json \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/${VERSION}")"
          [ "$STORED" = "$DIGEST" ] \
            || { echo "::error::registry stored the tag as ${STORED}, expected ${DIGEST}"; exit 1; }

          # Gate 3: resolve the tag through the docker client, so the check does not
          # depend on the same API call that wrote it.
          RESOLVED="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "$RESOLVED" = "$DIGEST" ] \
            || { echo "::error::tag ${IMAGE_REF} resolves to ${RESOLVED}, expected ${DIGEST}"; exit 1; }
          echo "tag ${IMAGE_REF} -> ${DIGEST}"

      # Reclaim a digest that was pushed but never tagged -- a run that died
      # between "Push by digest" and the tagging step. Such a version carries the
      # staging tag and nothing else, which is precisely the condition tested
      # below, and it is the ONLY case where deleting is safe.
      #
      # THE TAG SET IS THE SAFETY INTERLOCK, not a nicety. GHCR deletes VERSIONS
      # (digests), never individual tags. Once the version tag has been applied,
      # the staging tag and the release tag name the same version, so deleting
      # "the leftover staging tag" would delete the release. The guard makes that
      # impossible: a tagged release always has more than one tag by then.
      #
      # Best-effort throughout. GITHUB_TOKEN may not carry package-delete rights
      # depending on org policy, and a release must never fail over housekeeping.
      - name: Reclaim the digest if it was never tagged
        if: ${{ always() && !inputs.dry_run }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${DIGEST:-}" ] || { echo "nothing was pushed; nothing to reclaim"; exit 0; }

          REPO_PATH="${IMAGE_REPO#ghcr.io/}"
          ORG="${REPO_PATH%%/*}"
          PKG="${REPO_PATH#*/}"

          gh api --paginate "/orgs/${ORG}/packages/container/${PKG}/versions" \
            > versions.json 2>/dev/null || {
              echo "::notice::cannot list package versions (permissions); skipping cleanup"; exit 0; }

          ID="$(jq -r --arg d "$DIGEST" '.[] | select(.name==$d) | .id' versions.json)"
          TAGS="$(jq -r --arg d "$DIGEST" '.[] | select(.name==$d) | (.metadata.container.tags // []) | join(",")' versions.json)"
          rm -f versions.json

          [ -n "${ID:-}" ] || { echo "digest ${DIGEST} not found in the package listing; nothing to do"; exit 0; }

          if [ "${TAGS:-}" != "build" ]; then
            echo "digest ${DIGEST} carries tags [${TAGS:-<none>}] -- it is tagged for release, keeping it"
            exit 0
          fi

          echo "digest ${DIGEST} carries only the staging tag: the run never tagged it, reclaiming"
          gh api -X DELETE "/orgs/${ORG}/packages/container/${PKG}/versions/${ID}" >/dev/null 2>&1 \
            && echo "deleted abandoned version ${ID}" \
            || echo "::notice::could not delete version ${ID} (permissions); delete it by hand if it matters"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
          VERSION: ${{ steps.pins.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${IMAGE_REPO}@${DIGEST}"
            echo "${IMAGE_REF}   (tag applied only after the digest was verified)"
            echo '```'
            echo ""
            echo "**One commit closes the release.** Pin the digest and move"
            echo "\`IMAGE_VERSION\` together — both describe what this checkout deploys:"
            echo ""
            echo '```yaml'
            echo "# compose.yaml"
            echo "  image: ${IMAGE_REPO}:${VERSION}@${DIGEST}"
            echo '```'
            echo '```sh'
            echo "# versions.env"
            echo "IMAGE_VERSION=${VERSION}"
            echo '```'
            echo ""
            echo "Pull it:"
            echo ""
            echo '```sh'
            echo "docker login ghcr.io          # the package is not public"
            echo "docker pull ${IMAGE_REPO}@${DIGEST}"
            echo '```'
            echo ""
            echo "**Not signed.** A digest guarantees INTEGRITY — these exact bytes —"
            echo "but not AUTHENTICITY. Azure Key Vault signing, as pretorin-cli does"
            echo "it, is SECURITY.md ledger item 5."
          } >> "$GITHUB_STEP_SUMMARY"

  # SEPARATE JOB, and the only one with `contents: write`.
  #
  # Attaching the SBOM to the release makes it outlive workflow-artifact retention,
  # which matters for a compliance artifact — but `gh release upload` needs
  # contents:write, and the publish job above must not have it. pretorin-cli keeps
  # its `attach` job as the sole contents:write job for the same reason. Splitting
  # costs one artifact round-trip and keeps the build/push job read-only on contents.
  #
  # `needs: publish` means a failed or blocked release attaches nothing.
  attach-sbom:
    needs: publish
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # upload a release asset — the ONLY write here
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom-${{ needs.publish.outputs.version }}

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -f "sbom-${VERSION}.spdx.json"
          gh release upload "$TAG" "sbom-${VERSION}.spdx.json" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached sbom-${VERSION}.spdx.json to ${TAG}"
