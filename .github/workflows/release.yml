# Prepare and publish a Compliance Claw release set: a scanned, SBOM-bearing
# linux/amd64 image by immutable digest, plus the deployment assets that select it
# (scripts/release-assets.py). Procedure, commands and retries: docs/releasing.md.
#
# workflow_dispatch only; `gh release create` is NOT the trigger.
#   dry-run  (default, any ref) build, smoke, contracts, scan, SBOM, self-test.
#            No login, push, tag or release write.
#   prepare  (tag ref) push by digest, candidate-X.Y.Z, DRAFT release with the set.
#   finalize (tag ref, NO BUILD) the prepared candidate `digest` only: write the
#            final record (status "signed", trust key fingerprint) on the
#            draft. No version tag. The protected signer then signs that record
#            and the digest; it runs elsewhere and never runs this repository.
#   publish  (tag ref, NO BUILD) the same `digest`: verify the record and image
#            signatures with release-keys/ at the tag, THEN the version tag on
#            the SAME digest, byte readback, THEN un-draft. It never rewrites
#            the signed record.
#
# WHAT CANNOT HAPPEN. A failed build, smoke, contract test, blocking scan, SBOM
# check, round trip or asset check stops `prepare` before the draft exists.
# `finalize` and `publish` refuse a set or candidate tag that names other bytes.
# Without verified signatures, `publish` applies no version tag and leaves the
# release a draft. A version tag never moves, and a version whose release or
# version tag is published is never prepared again.
#
# IMAGE_VERSION LAGS. The tag supplies the version; no version-bump PR comes
# first. `IMAGE_VERSION` in versions.env means "the version this checkout
# deploys" and moves with compose.yaml's digest pin in ONE post-release PR,
# because the digest exists only after the build. Until then the release overlay
# selects the image for the tagged source. scripts/smoke.sh asserts the pair agrees.
#
# PUBLISH ORDER, from pretorin-cli: push BY DIGEST first, verify the round trip,
# and only THEN apply a human-readable tag. scripts/release-tag.sh applies the
# candidate and version tags by re-PUTting the exact manifest bytes.
#
# SIGNATURES. Only the candidate checks in `prepare` pass --allow-unsigned.
# `finalize` refuses without release-keys/compliance-claw-release.pub at the tag,
# so no release can be published until the reviewed key is committed. Package
# cleanup selects only the pushed image digest, never a signature (`.sig`) tag.
#
# NO CREDENTIALS LIVE HERE beyond the automatic GITHUB_TOKEN. The first step asserts
# that rather than trusting this comment.
#
# Pin carve-out: `uses:` cannot read versions.env, so action SHAs are pinned here.
# trivy and syft install from versions.env pins with checksum verification.
name: release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "dry-run: build, scan and SBOM only. prepare: candidate image and DRAFT release (tag ref). finalize: final record on the draft for the signer, no build (tag ref). publish: verify signatures, then final release, no build (tag ref)."
        type: choice
        options: [dry-run, prepare, finalize, publish]
        default: dry-run
      digest:
        description: "finalize and publish: the prepared candidate digest (sha256:...) from the prepare summary"
        type: string
        required: false
        default: ""

# Read-only by default. Each job that writes names exactly one write permission:
# packages (GHCR) or contents (GitHub Release). No job holds both.
permissions:
  contents: read

# ONE release operation at a time, repo-wide — deliberately not per-ref. Two runs
# would otherwise overlap on the shared `:build` staging ref below. That race is
# not corrupting (the digest is read from the local image right after push, never
# by resolving the tag), but a publish pipeline that can interleave with itself is
# a bad thing to have to reason about.
#
# cancel-in-progress stays false: a half-cancelled release is worse than a slow
# one, and a run that has pushed but not yet tagged must be allowed to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # dry-run and prepare. The only job that builds, and one of two that write to
  # GHCR. It never writes a GitHub Release.
  candidate:
    if: ${{ inputs.operation == 'dry-run' || inputs.operation == 'prepare' }}
    # prepare pushes to GHCR, so it waits for the protected `release` environment
    # (v* tags only, required reviewers). A dry run writes nothing and may run on
    # a branch, so it uses no environment.
    environment: ${{ inputs.operation == 'prepare' && 'release' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write     # push to GHCR (prepare only) — the only write here
    outputs:
      version: ${{ steps.pins.outputs.version }}
      tag: ${{ steps.pins.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      # actions/checkout v5, pinned to its commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Assert this workflow uses no credentials beyond GITHUB_TOKEN
        run: |
          set -euo pipefail
          if grep -oE 'secrets\.[A-Z_]+' .github/workflows/release.yml \
             | grep -v 'secrets.GITHUB_TOKEN' ; then
            echo "::error::release.yml references a secret other than GITHUB_TOKEN"
            exit 1
          fi
          echo "No credentials configured beyond the automatic GITHUB_TOKEN."

      # THE VERSION COMES FROM THE TAG the run was started on (`--ref vX.Y.Z`).
      # prepare refuses any other ref. A dry run on a branch labels itself from
      # versions.env — enough to rehearse the pipeline without inventing a release.
      - name: Resolve version and pins
        id: pins
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          . ./versions.env
          for v in IMAGE_REPO TRIVY_VERSION TRIVY_SHA256 SYFT_VERSION SYFT_SHA256; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "::error::$v is not set in versions.env"; exit 1; }
            echo "$v=$val" >> "$GITHUB_OUTPUT"
          done

          TAG=""
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "tag ${TAG} at ${GITHUB_SHA} -> version ${VERSION}"
            # versions.env is ALLOWED to lag here: it describes what the checkout
            # DEPLOYS, and the pin commit that updates it lands after the release.
            if [ "${VERSION}" != "${IMAGE_VERSION:-}" ]; then
              echo "::notice::versions.env still says IMAGE_VERSION=${IMAGE_VERSION:-unset}; the post-release pin commit moves it to ${VERSION}."
            fi
          elif [ "$OPERATION" = dry-run ]; then
            VERSION="${IMAGE_VERSION:?IMAGE_VERSION unset and no release tag}"
            echo "dry run on ${GITHUB_REF}, labelling from versions.env -> ${VERSION}"
          else
            echo "::error::${OPERATION} must run on a release tag: gh workflow run release.yml --ref vX.Y.Z -f operation=${OPERATION} (got ${GITHUB_REF})"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REPO}:${VERSION}" >> "$GITHUB_OUTPUT"
          # A CONSTANT staging ref, not build-${GITHUB_SHA}.
          #
          # `docker push` needs a tag, so publishing by digest requires some tag
          # to exist first. A per-commit name made that tag accumulate forever,
          # and it CANNOT BE CLEANED UP AFTERWARDS: on GHCR a package version IS
          # a digest and tags are attributes of it, so once the version tag is
          # applied, the staging tag and the release tag are the same version.
          # Deleting "the staging tag" would delete the released image.
          #
          # A constant name means at most one such tag exists, permanently
          # pointing at the most recent successful build. Nothing accumulates,
          # and nothing has to be deleted on the success path.
          echo "build_ref=${IMAGE_REPO}:build" >> "$GITHUB_OUTPUT"

      # Before an hour of build: the tag must name the commit being built, and a
      # version whose release is already published is complete — prepare must not
      # produce a second set of bytes for it. (A draft is not visible to this
      # read-only token; the draft job re-checks with write access.)
      - name: Bind the tag to this commit and refuse a completed version
        if: ${{ inputs.operation == 'prepare' }}
        env:
          TAG: ${{ steps.pins.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # true (draft), false (published) or none. Only "release not found"
          # means none; any other error stops the run.
          release_state() {
            local out
            if out="$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
              STATE="$out"
            elif printf '%s' "$out" | grep -qi 'release not found'; then
              STATE=none
            else
              echo "::error::cannot read release $1: ${out}"; exit 1
            fi
          }
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          TAGGED="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          [ "$TAGGED" = "$GITHUB_SHA" ] \
            || { echo "::error::tag ${TAG} is ${TAGGED}, but this run builds ${GITHUB_SHA}"; exit 1; }
          release_state "$TAG"
          if [ "$STATE" = false ]; then
            echo "::error::release ${TAG} is already published; a completed version is never prepared again. Use a new version."
            exit 1
          fi
          echo "tag ${TAG} -> ${TAGGED}; no published release for it"

      # trivy and syft from pinned versions, compared against pinned digests. CI
      # installs no unverified binary, for the same reason the build does not.
      - name: Install pinned release tooling
        env:
          TRIVY_VERSION: ${{ steps.pins.outputs.TRIVY_VERSION }}
          TRIVY_SHA256: ${{ steps.pins.outputs.TRIVY_SHA256 }}
          SYFT_VERSION: ${{ steps.pins.outputs.SYFT_VERSION }}
          SYFT_SHA256: ${{ steps.pins.outputs.SYFT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          TRIVY_TGZ="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$TRIVY_TGZ" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${TRIVY_TGZ}"
          echo "${TRIVY_SHA256}  ${TRIVY_TGZ}" | sha256sum -c -
          tar xzf "$TRIVY_TGZ" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

          SYFT_TGZ="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$SYFT_TGZ" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${SYFT_TGZ}"
          echo "${SYFT_SHA256}  ${SYFT_TGZ}" | sha256sum -c -
          tar xzf "$SYFT_TGZ" syft
          sudo install -m 0755 syft /usr/local/bin/syft

          trivy --version | head -1
          syft version | head -2

      # ubuntu-latest is amd64, so this is a native build: no qemu, and the
      # Dockerfile's own gates (Pretorin signature + digest, Slack plugin integrity)
      # run here exactly as they do on an operator's machine.
      # IMAGE_SELF_VERSION is what the image will say it is: the OCI version label
      # and the IMAGE_VERSION line of the versions.env copy inside it. It comes
      # from the release TAG, because versions.env in this checkout still holds
      # the PREVIOUS release's number -- the commit that moves it lands after this
      # run. Baking that stale line is exactly how v0.2.0 shipped saying 0.1.0.
      - name: Build
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg "IMAGE_SELF_VERSION=${VERSION}" \
            -t "$BUILD_REF" .

          # Assert it took, here rather than at the end: a mislabelled image must
          # not reach a scan, a push or an operator.
          LABEL="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$BUILD_REF")"
          [ "$LABEL" = "$VERSION" ] \
            || { echo "::error::image label says '${LABEL}', expected '${VERSION}'"; exit 1; }
          BAKED="$(docker run --rm --entrypoint bash "$BUILD_REF" -lc \
            'awk -F= "/^IMAGE_VERSION=/{print \$2}" /opt/compliance-claw/versions.env')"
          [ "$BAKED" = "$VERSION" ] \
            || { echo "::error::baked versions.env says '${BAKED}', expected '${VERSION}'"; exit 1; }
          echo "image self-reports ${VERSION} (OCI label and baked versions.env)"

      - name: Smoke the built image
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint bash "$BUILD_REF" -lc "$1"; }
          ARCH="$(run 'uname -m')"
          [ "$ARCH" = x86_64 ] || { echo "::error::image arch is ${ARCH}"; exit 1; }
          # THE SEED, BY ITS EXPLICIT PATH. These probes use --entrypoint bash,
          # which skips the entrypoint and therefore skips seeding, so there is
          # no active CLI in /home/node/.pretorin/bin to ask. Naming the seed is
          # also the honest thing: this step is asserting what the IMAGE
          # contains, not what a deployment would run.
          run '/opt/compliance-claw/pretorin-seed/pretorin version'
          run 'openclaw --version'
          # The seed must NOT be reachable as a bare name. Asserted against the
          # standard bin directories, NOT with `command -v`: run() uses `bash -lc`
          # and a login shell rebuilds PATH from /etc/profile, so `command -v`
          # would report "not found" no matter where the seed lived — a check that
          # cannot fail. Verified: the image's declared PATH does start with
          # /home/node/.pretorin/bin, and a login shell drops it.
          # Explicit -e tests, NOT `! ls a b c`: ls exits non-zero when ANY of its
          # arguments is missing, so `! ls` would be true as soon as one of the
          # three was absent — it reported success even with a pretorin sitting in
          # /usr/local/bin. Caught by actually planting one and watching the check
          # pass.
          run '! { [ -e /usr/local/bin/pretorin ] || [ -e /usr/bin/pretorin ] || [ -e /bin/pretorin ]; }'
          # And the active directory really is first on the image's PATH, which is
          # what makes `pretorin` mean one thing at runtime.
          IMG_PATH="$(docker image inspect "$BUILD_REF" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^PATH=')"
          case "$IMG_PATH" in
            PATH=/home/node/.pretorin/bin:*) ;;
            *) echo "::error::image PATH does not start with the active CLI dir: ${IMG_PATH}"; exit 1 ;;
          esac
          # The verified Slack artifact stays in the image for scanning. Runtime
          # activation uses the official managed installer, not this local path.
          run 'test -f /opt/compliance-claw/slack-seed/dist/index.js'
          run 'test -f /opt/compliance-claw/slack-plugin.verified'
          run 'test -f /opt/compliance-claw/managed-slack.mjs'
          run 'test -f /opt/compliance-claw/slack-channel.patch.json5'
          # The CLI updater, for the same reason: a broken COPY would otherwise
          # publish an image where /pretorin-update and the pretorin_update tool
          # simply do not exist, and nothing between the merge and the VM would
          # notice.
          run 'test -x /opt/compliance-claw/pretorin-update.sh'
          run 'test -f /opt/compliance-claw/plugins/pretorin-update/index.js'
          run 'test -f /opt/compliance-claw/plugins/pretorin-update/openclaw.plugin.json'
          # The input rules, offline and credential-free, against the bytes being
          # published rather than against a PR build.
          run '/opt/compliance-claw/pretorin-update.sh --self-test'
          echo "image smoke passed (${ARCH})"

      # File-backed secrets are a DEPLOYMENT INTERFACE, so the gate belongs on the
      # bytes operators actually pull, not only on the pull request that changed
      # them. build.yml runs this against the PR's local build; without it here, a
      # release could publish an image whose entrypoint no longer honours a mounted
      # secret and nothing between the merge and the VM would notice. Canary values
      # only — this workflow asserts it holds no credentials, and this keeps that true.
      - name: File-secret contract on the built image
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: bash scripts/test-file-secrets.sh "$BUILD_REF"

      - name: Native proxy authentication and local maintenance (isolated)
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: bash scripts/test-proxy-auth.sh "$BUILD_REF"

      # Exceptions printed BEFORE the gate, not buried in a file nobody opens.
      - name: Show the vulnerability exceptions being applied
        run: |
          set -euo pipefail
          {
            echo "### Vulnerability exceptions in effect"
            echo ""
            echo "From \`.trivyignore.yaml\`. Each is a fixable HIGH or CRITICAL being shipped anyway."
            echo ""
            python3 - <<'PY'
          import datetime, re
          text = open(".trivyignore.yaml").read()
          entries = re.findall(r"- id:\s*(\S+)(.*?)(?=\n  - id:|\Z)", text, re.S)
          today = datetime.date.today()
          for vid, body in entries:
              exp = re.search(r"expired_at:\s*(\S+)", body)
              exp = exp.group(1) if exp else "NEVER"
              flag = ""
              if exp != "NEVER":
                  d = datetime.date.fromisoformat(exp)
                  left = (d - today).days
                  flag = f" ({left} days left)" if left >= 0 else " (EXPIRED)"
              print(f"- `{vid}` expires {exp}{flag}")
          print()
          print(f"{len(entries)} exception(s).")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      # FAIL POLICY:
      #   HIGH or CRITICAL with a fix available -> the release is blocked.
      #   HIGH or CRITICAL with no fix -> reported, does not block.
      #   listed in .trivyignore.yaml   -> shipped, with a dated reason, until it expires.
      #
      # Unfixed findings remain in the report. The exception file lists only
      # findings inherited from the official upstream image, each with its own
      # id, exact package path, reason and expiry. New fixable HIGH or CRITICAL
      # findings must block publication.
      # Skip embedded SPDX manifests in _manifest/spdx_2.2/manifest.spdx.json:
      # they list packages that are not installed. Both scans still check the
      # installed packages, including bundled npm dependencies.
      - name: Vulnerability scan (blocking — fixable HIGH and CRITICAL)
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-files '**/_manifest/spdx_2.2/manifest.spdx.json' \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 --format table "$BUILD_REF"

      - name: Vulnerability report (report — all HIGH and CRITICAL)
        if: always()
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          {
            echo "### Vulnerability report"
            echo '```'
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
              --skip-files '**/_manifest/spdx_2.2/manifest.spdx.json' \
              --format table "$BUILD_REF" 2>&1 | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          syft "docker:${BUILD_REF}" -o spdx-json > "sbom-${VERSION}.spdx.json"
          N="$(python3 -c "import json;print(len(json.load(open('sbom-${VERSION}.spdx.json')).get('packages',[])))")"
          echo "SBOM packages: ${N}"
          [ "$N" -gt 0 ] || { echo "::error::the SBOM contains no packages"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ steps.pins.outputs.version }}
          path: sbom-${{ steps.pins.outputs.version }}.spdx.json
          if-no-files-found: error

      # The release-set rules, offline, on every operation: a dry run proves the
      # helper that prepare and publish depend on before either is attempted.
      - name: Release-set rules (offline)
        run: python3 scripts/release-assets.py --self-test

      - name: Log in to GHCR
        if: ${{ inputs.operation == 'prepare' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # A version tag that already exists is a completed version (for example,
      # one published before release sets existed). Never prepare new bytes for it.
      - name: Refuse a version whose image tag is already published
        if: ${{ inputs.operation == 'prepare' }}
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
        run: |
          set -euo pipefail
          if OUT="$(docker buildx imagetools inspect "$IMAGE_REF" 2>&1)"; then
            echo "::error::${IMAGE_REF} already exists; a completed version is never prepared again. Use a new version."
            exit 1
          fi
          # Only "not found" means absent. An auth, network or rate-limit error
          # stops here rather than an hour later at publish.
          printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown' \
            || { echo "::error::cannot tell whether ${IMAGE_REF} exists: ${OUT}"; exit 1; }
          echo "${IMAGE_REF} does not exist yet"

      # STEP 1 OF 2: publish BY DIGEST under the constant staging ref resolved
      # above (`:build`), never a per-release name. No other tag is applied yet —
      # see the verify step below. This is pretorin-cli's ordering: bytes are
      # published and checked before any human-readable tag points at them.
      - name: Push by digest
        id: push
        if: ${{ inputs.operation == 'prepare' }}
        env:
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
        run: |
          set -euo pipefail
          docker push "$BUILD_REF"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$BUILD_REF" | cut -d@ -f2)"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::could not read the pushed digest (got '${DIGEST}')"; exit 1 ;;
          esac
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed by digest: ${DIGEST}"

      # Prove the registry returns what we sent, BEFORE any other tag exists. The
      # local image is removed first so the pull cannot be served from cache, and the
      # SBOM is regenerated from the pulled bytes and compared.
      - name: Verify the published digest round-trips
        if: ${{ inputs.operation == 'prepare' }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          BUILD_REF: ${{ steps.pins.outputs.build_ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          docker rmi "$BUILD_REF" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

          docker pull "${IMAGE_REPO}@${DIGEST}"

          ARCH="$(docker run --rm --entrypoint bash "${IMAGE_REPO}@${DIGEST}" -lc 'uname -m')"
          [ "$ARCH" = x86_64 ] || { echo "::error::pulled image arch is ${ARCH}"; exit 1; }
          # The SEED, by its absolute path: it is deliberately off PATH, and the
          # login shell here rebuilds PATH anyway. Same probe as the built-image
          # smoke above.
          docker run --rm --entrypoint bash "${IMAGE_REPO}@${DIGEST}" -lc '/opt/compliance-claw/pretorin-seed/pretorin version'

          syft "docker:${IMAGE_REPO}@${DIGEST}" -o spdx-json > sbom.pulled.json
          BUILT="$(python3 -c "import json;print(len(json.load(open('sbom-${VERSION}.spdx.json')).get('packages',[])))")"
          PULLED="$(python3 -c 'import json;print(len(json.load(open("sbom.pulled.json")).get("packages",[])))')"
          echo "SBOM packages: built=${BUILT} pulled=${PULLED}"
          [ "$BUILT" = "$PULLED" ] || { echo "::error::pulled image inventory differs from the built image"; exit 1; }
          rm -f sbom.pulled.json
          echo "digest round-trip verified"

      # The release set, from the verified values only, BEFORE the candidate tag
      # moves: a set that cannot be generated leaves an earlier draft and its
      # candidate tag in step. prepare refuses a mismatched SBOM name, a malformed
      # digest or commit, or a tag that does not name this commit; check then
      # re-reads what was written.
      - name: Generate the release set
        if: ${{ inputs.operation == 'prepare' }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release-assets.py prepare --version "$VERSION" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --image-repository "$IMAGE_REPO" --digest "$DIGEST" \
            --sbom "sbom-${VERSION}.spdx.json" --out release-set --source .
          python3 scripts/release-assets.py check --allow-unsigned --dir release-set --stage candidate \
            --all-assets --version "$VERSION" --source .
          ls -l release-set

      # STEP 2 OF 2 for a candidate: `candidate-X.Y.Z` names the verified digest,
      # by the exact-manifest operation in scripts/release-tag.sh. It keeps the
      # candidate from looking abandoned once `:build` moves on, and it is how
      # `publish` proves the digest it tags is the one this run prepared. It may
      # move on a re-prepare; the version tag never does. NOT the stable tag.
      - name: Tag the verified digest as the candidate
        if: ${{ inputs.operation == 'prepare' }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.pins.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-tag.sh "$IMAGE_REPO" "$DIGEST" "candidate-${VERSION}" --allow-move

      # Reclaim a digest that was pushed but never tagged -- a run that died
      # between "Push by digest" and the candidate tag. Such a version carries the
      # staging tag and nothing else, which is precisely the condition tested
      # below, and it is the ONLY case where deleting is safe.
      #
      # THE TAG SET IS THE SAFETY INTERLOCK, not a nicety. GHCR deletes VERSIONS
      # (digests), never individual tags. Once the candidate tag has been applied,
      # the staging tag and the candidate tag name the same version, so deleting
      # "the leftover staging tag" would delete the candidate. The guard makes that
      # impossible: a tagged candidate always has more than one tag by then.
      #
      # SIGNATURES ARE NEVER SELECTED. A cosign signature is its own package
      # version (tag sha256-<hex>.sig), so `.name==$DIGEST` never matches it. The
      # signer signs only after `finalize`, long after this prepare-only step,
      # and a signed digest carries the candidate tag, so it is never reclaimed.
      #
      # Best-effort throughout. GITHUB_TOKEN may not carry package-delete rights
      # depending on org policy, and a release must never fail over housekeeping.
      - name: Reclaim the digest if it was never tagged
        if: ${{ always() && inputs.operation == 'prepare' }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${DIGEST:-}" ] || { echo "nothing was pushed; nothing to reclaim"; exit 0; }

          REPO_PATH="${IMAGE_REPO#ghcr.io/}"
          ORG="${REPO_PATH%%/*}"
          PKG="${REPO_PATH#*/}"

          gh api --paginate "/orgs/${ORG}/packages/container/${PKG}/versions" \
            > versions.json 2>/dev/null || {
              echo "::notice::cannot list package versions (permissions); skipping cleanup"; exit 0; }

          ID="$(jq -r --arg d "$DIGEST" '.[] | select(.name==$d) | .id' versions.json)"
          TAGS="$(jq -r --arg d "$DIGEST" '.[] | select(.name==$d) | (.metadata.container.tags // []) | join(",")' versions.json)"
          rm -f versions.json

          [ -n "${ID:-}" ] || { echo "digest ${DIGEST} not found in the package listing; nothing to do"; exit 0; }

          if [ "${TAGS:-}" != "build" ]; then
            echo "digest ${DIGEST} carries tags [${TAGS:-<none>}] -- it is tagged, keeping it"
            exit 0
          fi

          echo "digest ${DIGEST} carries only the staging tag: the run never tagged it, reclaiming"
          gh api -X DELETE "/orgs/${ORG}/packages/container/${PKG}/versions/${ID}" >/dev/null 2>&1 \
            && echo "deleted abandoned version ${ID}" \
            || echo "::notice::could not delete version ${ID} (permissions); delete it by hand if it matters"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ inputs.operation == 'prepare' }}
        with:
          name: release-set-${{ steps.pins.outputs.version }}
          path: release-set/
          if-no-files-found: error

      - name: Summary
        if: ${{ inputs.operation == 'prepare' }}
        env:
          IMAGE_REPO: ${{ steps.pins.outputs.IMAGE_REPO }}
          VERSION: ${{ steps.pins.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Candidate prepared (not a customer release)"
            echo ""
            echo '```'
            echo "${IMAGE_REPO}@${DIGEST}"
            echo "${IMAGE_REPO}:candidate-${VERSION}   (tag applied only after the digest was verified)"
            echo '```'
            echo ""
            echo "The draft release v${VERSION} carries the candidate release set. The"
            echo "version tag \`${VERSION}\` is NOT applied, and customers are not notified."
            echo "Check this exact candidate digest. Then, without a rebuild: finalize the"
            echo "record, run the release signer for this tag and digest, and publish."
            echo "finalize and publish refuse any other digest:"
            echo ""
            echo '```sh'
            echo "gh workflow run release.yml --ref v${VERSION} -f operation=finalize -f digest=${DIGEST}"
            echo "gh workflow run release.yml --ref v${VERSION} -f operation=publish -f digest=${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # prepare, after every candidate gate passed. SEPARATE JOB, contents:write only:
  # it writes the DRAFT release and has no packages access. `needs: candidate`
  # means a failed build, scan, round trip or asset check creates no draft.
  draft:
    needs: candidate
    if: ${{ inputs.operation == 'prepare' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create or update the DRAFT release — the ONLY write here
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-set-${{ needs.candidate.outputs.version }}
          path: release-set

      - name: Attach the candidate set to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
          # Prepended to the generated notes, so the published notes say it too.
          RELEASE_NOTE: "Guided install and the updater accept this release only after they verify its record signature and image signature with the Compliance Claw release key in the reviewed checkout (`release-keys/`). See docs/image-verification.md."
        run: |
          set -euo pipefail
          # true (draft), false (published) or none. Only "release not found"
          # means none; any other error stops the run.
          release_state() {
            local out
            if out="$(gh release view "$1" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
              STATE="$out"
            elif printf '%s' "$out" | grep -qi 'release not found'; then
              STATE=none
            else
              echo "::error::cannot read release $1: ${out}"; exit 1
            fi
          }
          python3 scripts/release-assets.py check --allow-unsigned --dir release-set --stage candidate \
            --all-assets --version "$VERSION"
          release_state "$TAG"
          case "$STATE" in
            none)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                --title "$TAG" --notes "$RELEASE_NOTE" --generate-notes release-set/*
              echo "created draft release ${TAG}" ;;
            true)
              # A draft is not complete: a re-prepare replaces its candidate set.
              # A new candidate invalidates any earlier signature, so the record
              # signature goes FIRST; no stale .sig survives a re-prepare. (An
              # earlier image signature names only the earlier digest.)
              # Listed first, so that an API error stops here instead of reading as "no .sig".
              ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
              if printf '%s\n' "$ASSETS" | grep -qx 'compliance-claw-release.json.sig'; then
                gh release delete-asset "$TAG" compliance-claw-release.json.sig \
                  --repo "$GITHUB_REPOSITORY" --yes
                echo "::notice::deleted the record signature of the earlier candidate; finalize and sign again"
              fi
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-set/*
              echo "replaced the candidate set on draft release ${TAG}" ;;
            *)
              echo "::error::release ${TAG} is already published; its assets are never replaced"
              exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # finalize (publish phase 1): NO BUILD. The final record that the signer
  # signs. stage final, status "signed" and the trust key fingerprint are fixed
  # here, BEFORE signing; nothing after this rewrites the record. No version
  # tag, and the release stays a draft.
  # ---------------------------------------------------------------------------
  final-record:
    if: ${{ inputs.operation == 'finalize' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # replace the record on the DRAFT — the ONLY write here
      packages: read    # confirm candidate-X.Y.Z names the digest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Log in to GHCR (read)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check the draft and write the final record
        id: rec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::finalize needs -f digest=sha256:<prepared candidate digest> (from the prepare summary)"; exit 1; }
          [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::finalize must run on a release tag: gh workflow run release.yml --ref vX.Y.Z -f operation=finalize"; exit 1; }
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          . ./versions.env
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"

          STATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)" \
            || { echo "::error::cannot read release ${TAG}: ${STATE}. Run operation=prepare on this tag first."; exit 1; }
          [ "$STATE" = true ] \
            || { echo "::error::release ${TAG} is already published; its record is never rewritten"; exit 1; }

          mkdir release-set
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-set \
            --pattern compliance-claw-release.json --pattern compose.release.yaml \
            --pattern "sbom-${VERSION}.spdx.json"
          # A signature beside a candidate signs other bytes; finalize refuses it.
          # Listed first, so that an API error stops here instead of reading as "no .sig".
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$ASSETS" | grep -qx 'compliance-claw-release.json.sig'; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-set \
              --pattern compliance-claw-release.json.sig
          fi
          cp release-set/compliance-claw-release.json draft-record.json

          # The record checks, the tag binding (the trust key is read from this
          # checkout) and the trust key fingerprint. Idempotent on a final record.
          SUMMARY="$(python3 scripts/release-assets.py finalize --dir release-set --source . --json)"
          REC_DIGEST="$(printf '%s' "$SUMMARY" | jq -r .digest)"
          [ "$REC_DIGEST" = "$CANDIDATE" ] \
            || { echo "::error::the release record names ${REC_DIGEST}; the digest input is ${CANDIDATE}. Check the current candidate, or prepare again."; exit 1; }
          REC_REPO="$(printf '%s' "$SUMMARY" | jq -r .image_reference | sed 's/:[^:/]*@.*$//')"
          [ "$REC_REPO" = "$IMAGE_REPO" ] \
            || { echo "::error::the record names ${REC_REPO}; versions.env says ${IMAGE_REPO}"; exit 1; }
          RESOLVED="$(docker buildx imagetools inspect "${IMAGE_REPO}:candidate-${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "$RESOLVED" = "$CANDIDATE" ] \
            || { echo "::error::${IMAGE_REPO}:candidate-${VERSION} is ${RESOLVED}; the release record names ${CANDIDATE}"; exit 1; }

          if cmp -s release-set/compliance-claw-release.json draft-record.json; then
            WRITE=false
          else
            WRITE=true
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "write=${WRITE}"
            echo "image_repo=${IMAGE_REPO}"
            echo "key_sha256=$(printf '%s' "$SUMMARY" | jq -r .key_sha256)"
          } >> "$GITHUB_OUTPUT"

      # The final record, kept by THIS run BEFORE the draft record is replaced.
      # `gh release upload --clobber` deletes the old asset before the upload, so
      # a failed upload can leave the draft with no record; this artifact is the
      # recovery input (docs/releasing.md#retries-and-failures).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ steps.rec.outputs.write == 'true' }}
        with:
          name: final-record-${{ steps.rec.outputs.version }}-attempt-${{ github.run_attempt }}
          path: release-set/compliance-claw-release.json
          if-no-files-found: error

      - name: Put the final record on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ inputs.digest }}
          TAG: ${{ steps.rec.outputs.tag }}
          VERSION: ${{ steps.rec.outputs.version }}
          WRITE: ${{ steps.rec.outputs.write }}
          IMAGE_REPO: ${{ steps.rec.outputs.image_repo }}
          KEY_SHA256: ${{ steps.rec.outputs.key_sha256 }}
          ARTIFACT: final-record-${{ steps.rec.outputs.version }}-attempt-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$WRITE" = false ]; then
            echo "the draft already holds this final record; nothing was written"
          else
            if ! gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
                 release-set/compliance-claw-release.json; then
              echo "::error::the final record upload failed. --clobber may have deleted the draft record. Recover with the record this run kept:"
              echo "  gh run download ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --name ${ARTIFACT} --dir /tmp/cc-final"
              echo "  gh release download ${TAG} --repo ${GITHUB_REPOSITORY} --dir /tmp/cc-final --pattern compose.release.yaml --pattern sbom-${VERSION}.spdx.json"
              echo "  python3 scripts/release-assets.py finalize --dir /tmp/cc-final --source .   # from a checkout of ${TAG}; must say 'already'"
              echo "  gh release upload ${TAG} --repo ${GITHUB_REPOSITORY} /tmp/cc-final/compliance-claw-release.json"
              echo "  gh workflow run release.yml --ref ${TAG} -f operation=finalize -f digest=${CANDIDATE}"
              exit 1
            fi
            mkdir readback
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir readback \
              --pattern compliance-claw-release.json
            cmp readback/compliance-claw-release.json release-set/compliance-claw-release.json \
              || { echo "::error::the draft record differs from the final record that was written"; exit 1; }
            echo "wrote the final record on draft release ${TAG}"
          fi
          echo "::notice::NOT PUBLISHED — awaiting signatures. ${TAG} is still a draft, and no version tag was applied."
          {
            echo "### NOT PUBLISHED — awaiting signatures"
            echo ""
            echo "Release ${TAG} is still a DRAFT. No version tag was applied. Customers"
            echo "cannot see it, and install and update refuse it until publish verifies"
            echo "both signatures."
            echo ""
            echo '```'
            echo "${IMAGE_REPO}@${CANDIDATE}"
            echo "record sha256 $(sha256sum release-set/compliance-claw-release.json | cut -d' ' -f1)"
            echo "trust key sha256 ${KEY_SHA256}"
            echo '```'
            echo ""
            echo "Next: the release signer signs this record and this digest for ${TAG}."
            echo "Then publish:"
            echo ""
            echo '```sh'
            echo "gh workflow run release.yml --ref ${TAG} -f operation=publish -f digest=${CANDIDATE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # publish (phase 2): NO BUILD, NO RECORD WRITE. Three jobs so that no job holds
  # both write permissions:
  #   final-assets   contents:write  read the signed draft set, verify the record
  #   final-image    packages:write  verify the image signature, THEN the version tag
  #   final-release  contents:write  byte readback, THEN un-draft
  # A failed signature check stops before the version tag and before un-draft.
  # Every step is safe to retry: nothing rewrites the record, the version tag
  # only accepts the recorded digest, and un-draft is the last write.
  # ---------------------------------------------------------------------------
  final-assets:
    if: ${{ inputs.operation == 'publish' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # drafts are visible only with write access; nothing is written here
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
      digest: ${{ steps.set.outputs.digest }}
      completed: ${{ steps.set.outputs.completed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Verify the signed set against its tag and the trust key
        id: set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::publish needs -f digest=sha256:<prepared candidate digest> (from the prepare summary)"; exit 1; }
          [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::publish must run on a release tag: gh workflow run release.yml --ref vX.Y.Z -f operation=publish"; exit 1; }
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          . ./versions.env
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"

          STATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)" \
            || { echo "::error::cannot read release ${TAG}: ${STATE}. Run operation=prepare on this tag first."; exit 1; }
          mkdir release-set
          # The record signature is required: a missing asset stops here.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-set \
            --pattern compliance-claw-release.json --pattern compliance-claw-release.json.sig \
            --pattern compose.release.yaml --pattern "sbom-${VERSION}.spdx.json" \
            || { echo "::error::cannot download the signed set of ${TAG}. Run operation=finalize, then the release signer, first."; exit 1; }

          # Signed only: the record must be final, name the trust key at this
          # tag, and its signature must verify over the exact record bytes.
          # The image signature is verified in final-image, which has the registry login.
          SUMMARY="$(python3 scripts/release-assets.py check --dir release-set --stage final \
            --all-assets --version "$VERSION" --source . --record-only --json)"
          REC_DIGEST="$(printf '%s' "$SUMMARY" | jq -r .digest)"
          [ "$REC_DIGEST" = "$CANDIDATE" ] \
            || { echo "::error::the release record names ${REC_DIGEST}; the digest input is ${CANDIDATE}. Check the current candidate, or prepare again."; exit 1; }
          REC_REPO="$(printf '%s' "$SUMMARY" | jq -r .image_reference | sed 's/:[^:/]*@.*$//')"
          [ "$REC_REPO" = "$IMAGE_REPO" ] \
            || { echo "::error::the record names ${REC_REPO}; versions.env says ${IMAGE_REPO}"; exit 1; }
          if [ "$STATE" = false ]; then
            # Already published: confirm, change nothing. Downstream jobs only verify.
            echo "completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "completed=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "digest=${REC_DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-set-${{ steps.set.outputs.version }}
          path: release-set/
          if-no-files-found: error

  final-image:
    needs: final-assets
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # apply the version tag — the ONLY write here
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: final-set-${{ needs.final-assets.outputs.version }}
          path: release-set

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The digest must be the one prepare verified: candidate-X.Y.Z names it
      # (applied only after the round trip). A completed release may have moved
      # past its candidate tag, so there the version tag is the evidence instead.
      - name: Confirm the recorded digest is the prepared candidate
        env:
          VERSION: ${{ needs.final-assets.outputs.version }}
          DIGEST: ${{ needs.final-assets.outputs.digest }}
          COMPLETED: ${{ needs.final-assets.outputs.completed }}
        run: |
          set -euo pipefail
          . ./versions.env
          WHICH="candidate-${VERSION}"
          [ "$COMPLETED" = false ] || WHICH="${VERSION}"
          RESOLVED="$(docker buildx imagetools inspect "${IMAGE_REPO}:${WHICH}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "$RESOLVED" = "$DIGEST" ] \
            || { echo "::error::${IMAGE_REPO}:${WHICH} is ${RESOLVED}; the release record names ${DIGEST}"; exit 1; }
          docker pull --platform linux/amd64 "${IMAGE_REPO}@${DIGEST}"
          PLATFORM="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REPO}@${DIGEST}")"
          [ "$PLATFORM" = linux/amd64 ] || { echo "::error::image platform is ${PLATFORM}"; exit 1; }
          echo "${IMAGE_REPO}:${WHICH} -> ${DIGEST} (${PLATFORM})"

      # The record again, then the image signature at the recorded digest, with
      # the same trust key. Only then the stable tag.
      - name: Verify the record and image signatures
        env:
          TAG: ${{ needs.final-assets.outputs.tag }}
          VERSION: ${{ needs.final-assets.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          # Default for a signed record: the record signature, then the image
          # signature at the digest with the pinned cosign (versions.env) and
          # the same key. Any failure stops here: no version tag, still a draft.
          python3 scripts/release-assets.py check --dir release-set --all-assets \
            --version "$VERSION" --source .

      # The stable tag, on the same bytes. release-tag.sh refuses to move an
      # existing version tag, and is a no-op when it already names this digest.
      - name: Apply the version tag to the prepared candidate digest
        env:
          VERSION: ${{ needs.final-assets.outputs.version }}
          DIGEST: ${{ needs.final-assets.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . ./versions.env
          bash scripts/release-tag.sh "$IMAGE_REPO" "$DIGEST" "$VERSION"

  final-release:
    needs: [final-assets, final-image]
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # un-draft — the ONLY write here
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: final-set-${{ needs.final-assets.outputs.version }}
          path: release-set

      - name: Publish the signed release set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.final-assets.outputs.tag }}
          VERSION: ${{ needs.final-assets.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          python3 scripts/release-assets.py check --dir release-set --all-assets --version "$VERSION" --source . --record-only
          STATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          # Byte readback: the draft must hold exactly the verified set. Nothing
          # is uploaded here; the signed record is never rewritten.
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern compliance-claw-release.json --pattern compliance-claw-release.json.sig \
            --pattern compose.release.yaml --pattern "sbom-${VERSION}.spdx.json"
          for f in release-set/*; do
            cmp "$f" "published/$(basename "$f")" \
              || { echo "::error::release asset $(basename "$f") differs from the verified set"; exit 1; }
          done
          python3 scripts/release-assets.py check --dir published --all-assets --version "$VERSION" --record-only
          if [ "$STATE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            echo "published release ${TAG}"
          else
            echo "release ${TAG} was already published with these exact assets"
          fi

      # What a customer gets, with no token: the published assets by their public
      # download URLs, verified with this checkout's key, and whether the image
      # package can be pulled without a login. Reports the truth; changes nothing.
      - name: Customer-style readback without a token
        env:
          VERSION: ${{ needs.final-assets.outputs.version }}
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/release-assets.py fetch \
            --version "$VERSION" --dir customer-readback --json --image-access | tee customer.json
          python3 scripts/release-assets.py check --dir customer-readback --all-assets --version "$VERSION" --record-only
          for f in release-set/*; do
            cmp "$f" "customer-readback/$(basename "$f")" \
              || { echo "::error::the public asset $(basename "$f") differs from the verified set"; exit 1; }
          done
          # Anonymous pull is a SEPARATE customer-release gate. While the package
          # is private this is a warning; it does not fail the run.
          ACCESS="$(jq -r .image_access customer.json)"
          if [ "$ACCESS" = anonymous ]; then
            echo "image ${VERSION}: pull without a login works"
          else
            echo "::warning::image ${VERSION}: pull WITHOUT a login fails (${ACCESS}). Customers need docker login ghcr.io. Anonymous pull is a separate gate and is NOT qualified by this run."
          fi
          echo "Token-free image pull: \`${ACCESS}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        env:
          VERSION: ${{ needs.final-assets.outputs.version }}
          DIGEST: ${{ needs.final-assets.outputs.digest }}
        run: |
          set -euo pipefail
          . ./versions.env
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${IMAGE_REPO}@${DIGEST}"
            echo "${IMAGE_REPO}:${VERSION}   (the prepared candidate digest; no rebuild)"
            echo '```'
            echo ""
            echo "The release v${VERSION} carries the signed final release set. The record"
            echo "signature and the image signature verified with release-keys/ at the tag."
            echo "Customers select it with compose.release.yaml (docs/image-verification.md)."
            echo ""
            echo "**One commit closes the release.** Pin the digest and move"
            echo "\`IMAGE_VERSION\` together — both describe what this checkout deploys:"
            echo ""
            echo '```yaml'
            echo "# compose.yaml"
            echo "  image: ${IMAGE_REPO}:${VERSION}@${DIGEST}"
            echo '```'
            echo '```sh'
            echo "# versions.env"
            echo "IMAGE_VERSION=${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
