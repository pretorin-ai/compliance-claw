# Publish a versioned, scanned, SBOM-bearing linux/amd64 image to GHCR, by digest.
#
# Triggered by a tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match IMAGE_VERSION in versions.env or the job refuses to run —
# versions.env stays the single source of truth for what version this is.
#
# What this pipeline delivers: BUILD -> SCAN -> SBOM -> PUBLISH BY IMMUTABLE
# DIGEST -> and an operator who pulls that digest gets exactly those bytes.
#
# THE IMAGE IS NOT SIGNED, deliberately. Keyless cosign would write a permanent,
# publicly searchable entry to the Sigstore transparency log naming this
# repository, and this repository is internal. A content-addressed digest still
# gives INTEGRITY — `@sha256:...` cannot resolve to different bytes than the ones
# scanned here — but it does not give AUTHENTICITY: it is no proof of who built
# the image. Anyone who can push to the registry can publish a different digest.
# That distinction is stated in README.md and SECURITY.md rather than glossed,
# and signing is a tracked hardening item, not an oversight.
#
# NO CREDENTIALS LIVE HERE. The only secret used is the automatic GITHUB_TOKEN,
# and only to push to GHCR. There is no Pretorin API key, no model key and no
# Slack token. The "no credentials" step below asserts that rather than trusting
# this comment.
#
# Scanning happens BEFORE the push, so a failing image is never published.
#
# Pin carve-out: `uses:` cannot read versions.env, so action SHAs are pinned here.
# Everything else — trivy, syft — is installed from a pinned version with a pinned
# SHA256, the same way the Dockerfile installs cosign for the Pretorin blob.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, scan and SBOM only — do not push"
        type: boolean
        default: true

# id-token is deliberately ABSENT. It exists only to mint OIDC tokens for keyless
# signing, and this pipeline does not sign. Requesting a permission nothing uses
# is how a workflow quietly accumulates authority nobody can account for.
permissions:
  contents: read
  packages: write     # push to GHCR — the only write this job performs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # actions/checkout v5, pinned to its commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Assert this workflow uses no credentials beyond GITHUB_TOKEN
        run: |
          set -euo pipefail
          # Any other `secrets.` reference would mean a credential reached CI,
          # which this repository's threat model does not allow.
          if grep -oE 'secrets\.[A-Z_]+' .github/workflows/release.yml \
             | grep -v 'secrets.GITHUB_TOKEN' ; then
            echo "::error::release.yml references a secret other than GITHUB_TOKEN"
            exit 1
          fi
          echo "No credentials configured beyond the automatic GITHUB_TOKEN."

      - name: Resolve pins from versions.env
        id: pins
        run: |
          set -euo pipefail
          . ./versions.env
          for v in IMAGE_REPO IMAGE_VERSION \
                   TRIVY_VERSION TRIVY_SHA256 SYFT_VERSION SYFT_SHA256; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "::error::$v is not set in versions.env"; exit 1; }
            echo "$v=$val" >> "$GITHUB_OUTPUT"
          done
          echo "image_ref=${IMAGE_REPO}:${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

      # The tag is the release's claim about its version; versions.env is what the
      # artifact is actually built from. A mismatch means compose.yaml, the image
      # tag and the git tag would disagree, so it fails here rather than shipping.
      - name: Assert the git tag matches IMAGE_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          WANT="v${{ steps.pins.outputs.IMAGE_VERSION }}"
          if [ "$TAG" != "$WANT" ]; then
            echo "::error::tag ${TAG} does not match versions.env (expected ${WANT})."
            echo "Bump IMAGE_VERSION in versions.env and compose.yaml, or retag."
            exit 1
          fi
          echo "tag ${TAG} matches versions.env"

      # trivy and syft installed from pinned versions and compared against
      # pinned digests. CI installs no unverified binary, for the same reason the
      # build does not: the tool that does the verifying gets verified too.
      - name: Install pinned release tooling
        env:
          TRIVY_VERSION: ${{ steps.pins.outputs.TRIVY_VERSION }}
          TRIVY_SHA256: ${{ steps.pins.outputs.TRIVY_SHA256 }}
          SYFT_VERSION: ${{ steps.pins.outputs.SYFT_VERSION }}
          SYFT_SHA256: ${{ steps.pins.outputs.SYFT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          TRIVY_TGZ="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$TRIVY_TGZ" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/${TRIVY_TGZ}"
          echo "${TRIVY_SHA256}  ${TRIVY_TGZ}" | sha256sum -c -
          tar xzf "$TRIVY_TGZ" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

          SYFT_TGZ="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$SYFT_TGZ" \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${SYFT_TGZ}"
          echo "${SYFT_SHA256}  ${SYFT_TGZ}" | sha256sum -c -
          tar xzf "$SYFT_TGZ" syft
          sudo install -m 0755 syft /usr/local/bin/syft

          trivy --version | head -1
          syft version | head -2

      # ubuntu-latest is amd64, so this is a native build: no qemu, and the
      # Dockerfile's own gates (Pretorin signature + digest, Slack plugin
      # integrity) run here exactly as they do on an operator's machine.
      - name: Build
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t "$IMAGE_REF" .

      - name: Smoke the built image
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint bash "$IMAGE_REF" -lc "$1"; }
          ARCH="$(run 'uname -m')"
          [ "$ARCH" = x86_64 ] || { echo "::error::image arch is ${ARCH}"; exit 1; }
          run 'pretorin version'
          run 'openclaw --version'
          # The Slack plugin has to be present in the image, not merely referenced
          # by the config template — this is the check that a broken COPY would fail.
          run 'test -f /opt/compliance-claw/plugins/slack/dist/index.js'
          run 'test -f /opt/compliance-claw/slack-channel.patch.json5'
          echo "image smoke passed (${ARCH})"

      # The exceptions are printed BEFORE the gate runs, not buried in a file
      # nobody opens. Whoever approves a release sees exactly what is being
      # shipped past the gate and when each exception expires.
      - name: Show the vulnerability exceptions being applied
        run: |
          set -euo pipefail
          {
            echo "### Vulnerability exceptions in effect"
            echo ""
            echo "From \`.trivyignore.yaml\`. Each is a fixable CRITICAL being shipped anyway."
            echo ""
            python3 - <<'PY'
          import datetime, re
          text = open(".trivyignore.yaml").read()
          # Deliberately not PyYAML: the runner has no guarantee of it, and this
          # is a summary, not a parser. The gate itself is Trivy's job.
          entries = re.findall(r"- id:\s*(\S+)(.*?)(?=\n  - id:|\Z)", text, re.S)
          today = datetime.date.today()
          for vid, body in entries:
              exp = re.search(r"expired_at:\s*(\S+)", body)
              exp = exp.group(1) if exp else "NEVER"
              flag = ""
              if exp != "NEVER":
                  d = datetime.date.fromisoformat(exp)
                  left = (d - today).days
                  flag = f" ({left} days left)" if left >= 0 else " (EXPIRED)"
              print(f"- `{vid}` expires {exp}{flag}")
          print()
          print(f"{len(entries)} exception(s).")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY" | tail -20

      # FAIL POLICY, stated plainly:
      #   CRITICAL with a fix available -> the release is blocked.
      #   HIGH, and CRITICAL with no fix -> reported, does not block.
      #   listed in .trivyignore.yaml   -> shipped, with a dated reason, until it expires.
      #
      # --ignore-unfixed is deliberate: a critical CVE with no upstream patch would
      # otherwise make every release unshippable, and a gate that cannot be
      # satisfied is a gate people disable.
      #
      # --ignorefile exists for the same reason, learned the hard way. This gate
      # was written without one and would have blocked the FIRST release: the
      # OpenClaw base image ships five fixable CRITICALs (two libgnutls30, one
      # @vitest/browser, two vendored copies of node-tar) that this repository
      # cannot patch without abandoning its digest-pinned base. Every exception is
      # per-id, carries a written justification, and EXPIRES — so a new fixable
      # CRITICAL still stops the release, and the existing ones come back for
      # review rather than being forgiven forever.
      - name: Vulnerability scan (blocking — fixable CRITICAL)
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 --format table "$IMAGE_REF"

      - name: Vulnerability report (non-blocking — HIGH and unfixed CRITICAL)
        if: always()
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
        run: |
          set -euo pipefail
          {
            echo "### Vulnerability report"
            echo '```'
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
              --format table "$IMAGE_REF" 2>&1 | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
        run: |
          set -euo pipefail
          syft "docker:${IMAGE_REF}" -o spdx-json > sbom.spdx.json
          # An SBOM that parses but describes nothing is worse than none at all:
          # it would be published alongside the image as if it were evidence.
          N="$(python3 -c 'import json;print(len(json.load(open("sbom.spdx.json")).get("packages",[])))')"
          echo "SBOM packages: ${N}"
          [ "$N" -gt 0 ] || { echo "::error::the SBOM contains no packages"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ steps.pins.outputs.IMAGE_VERSION }}
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        id: push
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          # RepoDigests is populated by the push, and the digest is what gets
          # published and pinned: a tag is mutable, a digest is the artifact.
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF" | cut -d@ -f2)"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::could not read the pushed digest (got '${DIGEST}')"; exit 1 ;;
          esac
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed ${IMAGE_REF}@${DIGEST}"

      # THE POINT OF THE WHOLE PIPELINE: prove that pulling the published digest
      # returns the bytes that were just built, smoked, scanned and inventoried.
      #
      # Without this the digest is only an assertion. The image is removed from the
      # local daemon first, so the pull cannot be served from cache, and the SBOM is
      # regenerated from the PULLED image and compared against the one produced from
      # the local build. A mismatch means the registry did not return what we sent.
      - name: Verify the published digest round-trips
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker rmi "$IMAGE_REF" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

          docker pull "${IMAGE_REF}@${DIGEST}"

          # The pulled image must run and be the right architecture.
          ARCH="$(docker run --rm --entrypoint bash "${IMAGE_REF}@${DIGEST}" -lc 'uname -m')"
          [ "$ARCH" = x86_64 ] || { echo "::error::pulled image arch is ${ARCH}"; exit 1; }
          docker run --rm --entrypoint bash "${IMAGE_REF}@${DIGEST}" -lc 'pretorin version'

          # Same package inventory from the pulled bytes as from the built bytes.
          syft "docker:${IMAGE_REF}@${DIGEST}" -o spdx-json > sbom.pulled.json
          BUILT="$(python3 -c 'import json;d=json.load(open("sbom.spdx.json"));print(len(d.get("packages",[])))')"
          PULLED="$(python3 -c 'import json;d=json.load(open("sbom.pulled.json"));print(len(d.get("packages",[])))')"
          echo "SBOM packages: built=${BUILT} pulled=${PULLED}"
          [ "$BUILT" = "$PULLED" ] || { echo "::error::pulled image inventory differs from the built image"; exit 1; }
          echo "digest round-trip verified: ${IMAGE_REF}@${DIGEST}"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_REF: ${{ steps.pins.outputs.image_ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${IMAGE_REF}@${DIGEST}"
            echo '```'
            echo ""
            echo "**Pin this digest in \`compose.yaml\`** — a tag is mutable, and the"
            echo "digest an operator verified is not necessarily the one they later pull:"
            echo ""
            echo '```yaml'
            echo "  image: ${IMAGE_REF}@${DIGEST}"
            echo '```'
            echo ""
            echo "Pull it by digest — the tag is mutable, the digest is the artifact:"
            echo ""
            echo '```sh'
            echo "docker login ghcr.io          # the package is not public"
            echo "docker pull ${IMAGE_REF}@${DIGEST}"
            echo '```'
            echo ""
            echo "**Not signed.** A digest guarantees INTEGRITY — these exact bytes —"
            echo "but not AUTHENTICITY: it is no proof of who built them. Image signing"
            echo "is a tracked hardening item; see SECURITY.md."
            echo ""
            echo "The SBOM for this digest is attached to this run as an artifact."
          } >> "$GITHUB_STEP_SUMMARY"
