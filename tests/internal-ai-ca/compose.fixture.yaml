# compose.fixture.yaml — test-only overlay for tests/internal-ai-ca/run.sh.
#
# It selects the candidate image, adds a mock AI endpoint, and puts the project
# on an INTERNAL network: no container in this project can reach the internet,
# so a pass cannot come from a real provider. Not for customer use.

services:
  # Both target mounts point at an empty temporary directory, so the agent's
  # tool call cannot reach the checkout's workspace/targets. Compose merges
  # these over the base mounts by container path.
  openclaw:
    image: "${INTERNAL_AI_TEST_IMAGE:?set INTERNAL_AI_TEST_IMAGE}"
    volumes:
      - "${INTERNAL_AI_TEST_DIR:?set INTERNAL_AI_TEST_DIR}/targets:/workspace/targets:ro"
      - "${INTERNAL_AI_TEST_DIR:?set INTERNAL_AI_TEST_DIR}/targets:/var/lib/compliance-claw/targets:rw"
  cli:
    image: "${INTERNAL_AI_TEST_IMAGE:?set INTERNAL_AI_TEST_IMAGE}"
    volumes:
      - "${INTERNAL_AI_TEST_DIR:?set INTERNAL_AI_TEST_DIR}/targets:/workspace/targets:ro"

  mock-ai:
    image: "${INTERNAL_AI_TEST_IMAGE:?set INTERNAL_AI_TEST_IMAGE}"
    platform: linux/amd64
    entrypoint: ["node", "/fixture/mock-openai.mjs"]
    # Its own health command: the image's checks a gateway. `up --wait` needs
    # one (Compose 2.38 refuses a service without it), and it proves the mock
    # listens before the first model request.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8443, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      MOCK_CERT_DIR: /fixture-certs/${INTERNAL_AI_TEST_CERT_SET:-approved}
      MOCK_CERT_SET: ${INTERNAL_AI_TEST_CERT_SET:-approved}
      MOCK_EXPECTED_KEY_FILE: /fixture-key/internal-ai-api-key
    volumes:
      - "./tests/internal-ai-ca/mock-openai.mjs:/fixture/mock-openai.mjs:ro"
      - "${INTERNAL_AI_TEST_DIR:?set INTERNAL_AI_TEST_DIR}/certs:/fixture-certs:ro"
      - "${COMPLIANCE_CLAW_SECRET_DIR:?set COMPLIANCE_CLAW_SECRET_DIR}:/fixture-key:ro"
    networks:
      default:
        aliases:
          - ai.internal.test

networks:
  default:
    internal: true
